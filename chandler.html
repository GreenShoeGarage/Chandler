<!DOCTYPE html>
<!-- CHANDLER :: chandler.html :: v1.4.0 -->
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHANDLER, a common parts library (FI-269)</title>
<style>
:root{
  --bg:#0d1518; --panel:#121e22; --panel-2:#0f191d; --ink:#dfe7e6; --muted:#8ba0a3;
  --line:#24363b; --line-2:#31474d;
  --brass:#c8a24a; --brass-dim:#7d6530;
  --pass:#4fb3a0; --unknown:#d99a2b; --fail:#c9603f; --sample:#8d7bb8;
  --focus:#c8a24a;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:2px;
}
html[data-theme="day"]{
  --bg:#eceae4; --panel:#f7f6f2; --panel-2:#e4e1d8; --ink:#1d2427; --muted:#5d6a6d;
  --line:#cdc9bd; --line-2:#b3ae9f;
  --brass:#7a5c14; --brass-dim:#a08a4d;
  --pass:#1f6b5c; --unknown:#8a5b06; --fail:#93361b; --sample:#5a4a80;
  --focus:#7a5c14;
}
html[data-theme="contrast"]{
  --bg:#000; --panel:#000; --panel-2:#0a0a0a; --ink:#fff; --muted:#e8e8e8;
  --line:#fff; --line-2:#fff;
  --brass:#ffd85e; --brass-dim:#ffd85e;
  --pass:#5fffd0; --unknown:#ffd85e; --fail:#ff9a7a; --sample:#dcb4ff;
  --focus:#ffd85e;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:clamp(15px,0.55vw + 13px,17px); line-height:1.5;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4,.mono,.eyebrow,th,.stamp,.btn,.tag{font-family:var(--mono)}
h1,h2,h3,h4{margin:0 0 .4em; font-weight:600; letter-spacing:.06em}
h1{font-size:1.05rem; text-transform:uppercase}
h2{font-size:.95rem; text-transform:uppercase; color:var(--brass)}
h3{font-size:.82rem; text-transform:uppercase; color:var(--muted); letter-spacing:.12em}
p{margin:0 0 .7em}
a{color:var(--brass)}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.skip{position:absolute;left:-9999px}
.skip:focus{left:8px;top:8px;z-index:99;background:var(--panel);padding:8px;border:1px solid var(--brass)}

/* masthead */
header.masthead{
  border-bottom:1px solid var(--line); background:var(--panel-2);
  display:flex; align-items:center; gap:12px; padding:10px 14px; flex-wrap:wrap;
  position:sticky; top:0; z-index:20;
}
.wordmark{font-family:var(--mono); font-weight:700; letter-spacing:.34em; text-transform:uppercase; font-size:.95rem; color:var(--ink)}
.wordmark span{color:var(--brass)}
.subtitle{color:var(--muted); font-size:.76rem; letter-spacing:.04em}
.masthead .spacer{flex:1}
.verstamp{font-family:var(--mono); font-size:.7rem; color:var(--muted); border:1px solid var(--line); padding:2px 6px; border-radius:var(--r)}

/* nav */
nav.stations{border-bottom:1px solid var(--line); background:var(--panel-2); padding:0 8px; position:sticky; top:47px; z-index:19}
nav.stations ul{list-style:none; margin:0; padding:0; display:flex; overflow-x:auto; gap:2px}
nav.stations button{
  background:none; border:0; border-bottom:2px solid transparent; color:var(--muted);
  font-family:var(--mono); font-size:.74rem; letter-spacing:.13em; text-transform:uppercase;
  padding:12px 12px; min-height:44px; cursor:pointer; white-space:nowrap;
}
nav.stations button[aria-current="true"]{color:var(--brass); border-bottom-color:var(--brass)}
nav.stations button:hover{color:var(--ink)}

main{padding:16px 14px 64px; max-width:1180px; margin:0 auto}
.station[hidden]{display:none}

/* layout */
.split{display:grid; grid-template-columns:minmax(220px,280px) 1fr; gap:18px; align-items:start}
@media (max-width:820px){ .split{grid-template-columns:1fr} }
.panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:14px}
.panel + .panel{margin-top:12px}
.rowwrap{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px}

/* controls */
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{
  background:var(--panel-2); color:var(--ink); border:1px solid var(--line-2);
  border-radius:var(--r); padding:9px 10px; min-height:40px; font:inherit; width:100%;
}
textarea{min-height:80px; font-family:var(--mono); font-size:.8rem}
label{display:block; font-family:var(--mono); font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:4px}
.field{margin-bottom:10px}
.btn{
  background:var(--panel-2); color:var(--ink); border:1px solid var(--line-2); border-radius:var(--r);
  padding:9px 12px; min-height:44px; font-size:.75rem; letter-spacing:.1em; text-transform:uppercase; cursor:pointer;
}
.btn:hover{border-color:var(--brass); color:var(--brass)}
.btn.primary{border-color:var(--brass); color:var(--brass)}
.btn.small{min-height:34px; padding:5px 9px; font-size:.68rem}
.btn[aria-pressed="true"]{border-color:var(--brass); color:var(--brass)}

/* stamps and tags */
.stamp{
  display:inline-block; border:1px solid currentColor; border-radius:var(--r);
  padding:2px 6px; font-size:.66rem; letter-spacing:.12em; text-transform:uppercase;
}
.stamp.pass{color:var(--pass)} .stamp.unknown{color:var(--unknown)} .stamp.fail{color:var(--fail)}
.stamp.admitted{color:var(--pass)} .stamp.unverified{color:var(--unknown)} .stamp.excluded{color:var(--fail)}
.stamp.sample{color:var(--sample)}
.tag{display:inline-block; border:1px solid var(--line-2); color:var(--muted); border-radius:var(--r); padding:2px 6px; font-size:.66rem; letter-spacing:.08em}
.tag.family{border-color:var(--brass-dim); color:var(--brass)}
.eyebrow{font-size:.66rem; letter-spacing:.18em; text-transform:uppercase; color:var(--muted)}

/* the bin card, the signature element */
.bincard{border:1px solid var(--line-2); border-radius:var(--r); background:var(--panel); position:relative; overflow:hidden}
.bincard::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--brass-dim)}
.bincard.provisional::before{background:var(--unknown)}
.bincard .cardhead{display:flex; gap:12px; justify-content:space-between; padding:12px 14px 10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap}
.bincard .cardbody{padding:12px 14px 14px 16px}
.familystamp{
  font-family:var(--mono); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase;
  color:var(--brass); border:1px dashed var(--brass-dim); padding:4px 8px; border-radius:var(--r); white-space:nowrap;
}
.why{border-left:2px solid var(--line-2); padding-left:10px; color:var(--muted); font-size:.9rem}

/* lists */
.slotlist{list-style:none; margin:0; padding:0}
.slotlist li{border-bottom:1px solid var(--line)}
.slotlist button{
  width:100%; text-align:left; background:none; border:0; color:var(--ink);
  padding:10px 6px; min-height:44px; cursor:pointer; display:block;
}
.slotlist button:hover{background:var(--panel-2)}
.slotlist .nm{display:block; font-size:.92rem}
.slotlist .meta{display:block; color:var(--muted); font-size:.72rem; font-family:var(--mono); margin-top:2px}

table{width:100%; border-collapse:collapse; font-size:.84rem}
th{text-align:left; font-size:.66rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--line-2); padding:6px 8px; font-weight:600}
td{border-bottom:1px solid var(--line); padding:8px; vertical-align:top}
.tablewrap{overflow-x:auto}
.num{text-align:right; font-family:var(--mono)}

.gaterow{display:flex; flex-wrap:wrap; gap:5px; margin:8px 0}
.gate{border:1px solid currentColor; border-radius:var(--r); padding:3px 7px; font-family:var(--mono); font-size:.65rem; letter-spacing:.06em; text-transform:uppercase; background:none; cursor:help}
.gate.pass{color:var(--pass)} .gate.unknown{color:var(--unknown)} .gate.fail{color:var(--fail)}

.notice{border:1px solid var(--line-2); border-left:3px solid var(--brass); padding:10px 12px; border-radius:var(--r); font-size:.86rem; background:var(--panel-2)}
.notice.warn{border-left-color:var(--unknown)}
.notice.bad{border-left-color:var(--fail)}
.empty{color:var(--muted); font-size:.9rem; border:1px dashed var(--line-2); padding:14px; border-radius:var(--r)}
.kv{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:.84rem}
.kv dt{font-family:var(--mono); font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.kv dd{margin:0}
.stat{border:1px solid var(--line); border-radius:var(--r); padding:10px 12px; background:var(--panel-2)}
.stat .n{font-family:var(--mono); font-size:1.35rem; color:var(--brass); display:block}
.stat .l{font-size:.7rem; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; font-family:var(--mono)}
.savestate{font-family:var(--mono); font-size:.68rem; color:var(--muted)}
.testline{font-family:var(--mono); font-size:.76rem; padding:3px 0; border-bottom:1px solid var(--line)}
.testline.bad{color:var(--fail)}
details{border:1px solid var(--line); border-radius:var(--r); padding:8px 10px; margin-bottom:8px; background:var(--panel-2)}
summary{cursor:pointer; font-family:var(--mono); font-size:.74rem; letter-spacing:.08em; text-transform:uppercase; min-height:28px}
.hint{color:var(--muted); font-size:.78rem}

/* category tree */
.tree ul{list-style:none; margin:0; padding:0}
.tree ul ul{padding-left:10px; border-left:1px solid var(--line); margin-left:6px}
.tree button{
  display:block; width:100%; text-align:left; background:none; border:0; color:var(--ink);
  font-size:.82rem; padding:7px 6px; min-height:34px; cursor:pointer; border-radius:var(--r);
}
.tree button:hover{background:var(--panel-2); color:var(--brass)}
.tree button[aria-pressed="true"]{color:var(--brass); background:var(--panel-2)}
.tree .n{float:right; font-family:var(--mono); font-size:.68rem; color:var(--muted)}
.tree button[aria-pressed="true"] .n{color:var(--brass)}
.kbd{font-family:var(--mono); font-size:.66rem; border:1px solid var(--line-2); border-radius:var(--r); padding:1px 5px; color:var(--muted)}
.groupbar{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin:16px 0 6px}
.editform{border-top:1px solid var(--line); margin-top:10px; padding-top:10px}
@media (prefers-reduced-motion:no-preference){ .btn,nav.stations button{transition:color .12s ease,border-color .12s ease} }
@media print{ nav.stations,header.masthead{display:none} body{background:#fff;color:#000} }
</style>
</head>

g access.","key_parameters":[{"name":"Pitch","value":"2.54","unit":"mm"},{"name":"Rows","value":"1 or 2","unit":""}],"preferred_family":"2.54 mm pitch, breakaway strip","why_this_family":"0.1 inch is the universal prototype pitch. Breakaway strips mean one purchase covers every pin count.","typical_applications":["Programming headers","Module sockets","Jumper selects"],"coverage_note":"Not for anything that vibrates or needs retention. Use a latching wire to board connector.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"E-CONN-JST-PH","domain":"electronic","category_path":["Electronic","Interconnect","Wire to board"],"name":"Wire to board connector, 2.0 mm latching","function_summary":"Retained wire to board connection for power and small signal harnesses.","key_parameters":[{"name":"Pitch","value":"2.0","unit":"mm"},{"name":"Current","value":"2","unit":"A"}],"preferred_family":"JST PH series, 2.0 mm pitch","why_this_family":"JST PH is the maker default for battery and sensor leads, it latches, and the crimp tooling is affordable.","typical_applications":[],"coverage_note":"The crimp contact and the crimp tool are part of this decision. Budget for both before committing.","required_tooling":[{"name":"Crimp tool for JST PH contacts, 22 to 28 AWG","note":"A generic open barrel crimper will make joints that pull out. This is the single most expensive forgotten item in the interconnect category.","one_time":true},{"name":"Contact extraction pick","note":"For getting a mis-crimped contact back out of the housing.","one_time":true}],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"E-CONN-JST-SH","domain":"electronic","category_path":["Electronic","Interconnect","Wire to board"],"name":"Wire to board connector, 1.0 mm latching","function_summary":"Compact retained harness connection where 2.0 mm will not fit.","key_parameters": block, 5.08 mm pitch","function_summary":"Field wireable connections for power and signal on equipment that gets installed.","key_parameters":[{"name":"Pitch","value":"5.08","unit":"mm"},{"name":"Wire","value":"16 to 26","unit":"AWG"}],"preferred_family":"5.08 mm pitch, modular and pluggable variants","why_this_family":"5.08 mm is the pitch that accepts real installation wire and is available in both fixed and pluggable form from many manufacturers.","typical_applications":[],"coverage_note":"Not for anything that vibrates without a strain relief plan.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"E-SW-TACT","domain":"electronic","category_path":["Electronic","Electromechanical","Switch"],"name":"Tactile switch, 6 mm","function_summary":"Momentary user input, reset and mode buttons.","key_parameters":[{"name":"Body","value":"6 x 6","unit":"mm"},{"name":"Actuation force","value":"1.5 to 2.5","unit":"N"}],"preferred_family":"6 x 6 mm through hole and SMD tactile switch","why_this_family":"The 6 mm body is the most second sourced switch footprint there is, and cap options are widely available.","typical_applications":[],"coverage_note":"Panel mounted buttons need a separate slot. This is a board mounted switch.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"E-SW-SLIDE","domain":"electronic","category_path":["Electronic","Electromechanical","Switch"],"name":"SPDT slide switch, board mount","function_summary":"Latching power or mode selection.","key_parameters":[{"name":"Poles","value":"1","unit":""},{"name":"Throws","value":"2","unit":""}],"preferred_family":"Small SPDT slide switch, through hole","why_this_family":"A latching mechanical switch is still the most honest power switch for a battery device.","typical_applications":[],"coverage_note":"Contact rating is low. Switch a MOSFET gate rather than the load current on anything above a few hundred milliamps.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"E-BUZZER","domain":"electronic","category_path":["Electronic","Electromechanical","Audio"],"name":"Magnetic or piezo buzzer","function_summary":"Audible alerts and feedback.","key_parameters":[{"name":"Drive","value":"self driving or externally driven","unit":""}],"preferred_family":"Board mount buzzer, self driving preferred for simplicity","why_this_family":"Self driving parts need one GPIO and no timer, which is the right trade for alerts.","typical_applications":[],"coverage_note":"Externally driven piezo elements are louder and more controllable but need a drive circuit. Different slot territory.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"E-RELAY","domain":"electronic","category_path":["Electronic","Electromechanical","Relay"],"name":"Signal relay, board mount","function_summary":"Galvanically isolated switching of a load the board cannot switch directly.","key_parameters":[{"name":"Coil","value":"5 or 12","unit":"V"},{"name":"Contact","value":"1 to 10","unit":"A"}],"preferred_family":"Board mount relay with a documented coil current and a flyback plan","why_this_family":"A relay plus the small signal transistor slot and the signal diode slot is a complete, well understood isolation building block.","typical_applications":[],"coverage_note":"Mains switching brings creepage, clearance and safety agency requirements that are out of scope for this library. Do not treat a relay part number as permission.","required_tooling":[{"name":"A flyback diode on every coil","note":"Recorded here because it is the thing people leave off. Use the signal diode slot.","one_time":false}],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-SCREW-SHCS-M3","domain":"mechanical","category_path":["Mechanical","Fastener","Machine screw"],"name":"Socket head cap screw, M3","function_summary":"The house fastener. Structural and cover fastening for enclosures, brackets and mechanisms.","key_parameters":[{"name":"Thread","value":"M3 x 0.5","unit":""},{"name":"Drive","value":"2.5 mm hex","unit":""},{"name":"Lengths","value":"6, 8, 10, 12, 16, 20","unit":"mm"}],"preferred_family":"ISO 4762 M3 x 0.5, stainless A2 or black oxide alloy steel","why_this_family":"M3 is the single most useful fastener size in maker scale work. Declaring it as the house family means one hex key, one tap, one clearance drill and one counterbore live on the bench. Hold to the listed length ladder and the inventory stays small.","typical_applications":["Enclosure assembly","Bracket mounting","Motor mounting"],"coverage_note":"Loads above light structural duty need a real fastener calculation, which this library does not do. M2, M4 and M5 have their own slots.","required_tooling":[{"name":"2.5 mm hex key or bit","note":"One key drives the whole family. That is most of the reason for the family.","one_time":true},{"name":"3.2 mm clearance drill","note":"Matches the PCB mounting hole convention.","one_time":true},{"name":"M3 x 0.5 tap and a 2.5 mm tapping drill","note":"For tapping into aluminium or acetal.","one_time":true}],"family_ladder":[{"label":"M3 x 6","identifier":"ISO 4762 M3 x 6, A2-70","note":"Thin covers and stacked sheet."},{"label":"M3 x 8","identifier":"ISO 4762 M3 x 8, A2-70","note":"The default. Buy the most of this one."},{"label":"M3 x 10","identifier":"ISO 4762 M3 x 10, A2-70","note":""},{"label":"M3 x 12","identifier":"ISO 4762 M3 x 12, A2-70","note":"Into heat set inserts through a 3 mm wall."},{"label":"M3 x 16","identifier":"ISO 4762 M3 x 16, A2-70","note":""},{"label":"M3 x 20","identifier":"ISO 4762 M3 x 20, A2-70","note":"Through a printed boss into a nut pocket."}],"numbering_scheme":"Specify as ISO 4762 M3 x <length>, then material and finish. Distributors index these by length and material, not by a single MPN.","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-SCREW-BHCS-M3","domain":"mechanical","category_path":["Mechanical","Fastener","Machine screw"],"name":"Button head cap screw, M3","function_summary":"Cover and panel fastening where a low, rounded head is wanted.","key_parameters":[{"name":"Thread","value":"M3 x 0.5","unit":""},{"name":"Drive","value":"2 mm hex","unit":""}],"preferred_family":"ISO 7380 M3 x 0.5","why_this_family":"Same thread as the house family so the tap and clearance drill do not change, only the head appearance and the hex key.","typical_applications":[],"coverage_note":"Button heads are weaker in tension than cap heads and should not be used to clamp a structural joint.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-SCREW-M2-M4","domain":"mechanical","category_path":["Mechanical","Fastener","Machine screw"],"name":"Socket head cap screw, M2 and M2.5 and M4 and M5","function_summary":"The sizes either side of the house family, kept deliberately narrow.","key_parameters":[{"name":"Threads","value":"M2, M2.5, M4, M5","unit":""}],"preferred_family":"ISO 4762 in M2, M2.5, M4 and M5","why_this_family":"M2.5 is the PCB and small module size, M4 and M5 carry real structural load, M2 is for small electromechanical parts. Everything else is an exception that should be justified in writing.","typical_applications":[],"coverage_note":"No imperial machine screws in the library by default. If a design needs them, that is an intentional deviation and belongs in the Waiting Room with a reason.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-NUT-HEX-M3","domain":"mechanical","category_path":["Mechanical","Fastener","Nut"],"name":"Hex nut, M3","function_summary":"The mating half of the house fastener where a tapped hole is not available.","key_parameters":[{"name":"Thread","value":"M3 x 0.5","unit":""},{"name":"Across flats","value":"5.5","unit":"mm"}],"preferred_family":"ISO 4032 M3, stainless A2","why_this_family":"5.5 mm across flats is the dimension your captive nut pocket has to match. Standardizing on it means one pocket geometry across every printed and machined part.","typical_applications":[],"coverage_note":"Captive nut pockets in printed parts need a tolerance decision that this library does not make.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-WASHER-M3","domain":"mechanical","category_path":["Mechanical","Fastener","Washer"],"name":"Flat washer, M3","function_summary":"Spread clamping load, protect a soft surface, and take up a clearance hole.","key_parameters":[{"name":"Bore","value":"3.2","unit":"mm"}],"preferred_family":"ISO 7089 M3, stainless A2","why_this_family":"Standard form washers keep the stack height predictable, which matters when the fastener length ladder is fixed.","typical_applications":[],"coverage_note":"Split lock washers are deliberately not in the library. They are less effective than a nylon insert nut or thread locker.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-INSERT-HEAT","domain":"mechanical","category_path":["Mechanical","Fastener","Threaded insert"],"name":"Heat set threaded insert, M3","function_summary":"Put a real metal thread into a 3D printed or plastic part.","key_parameters":[{"name":"Thread","value":"M3","unit":""},{"name":"Outside diameter","value":"4.6 to 5.0","unit":"mm"},{"name":"Length","value":"5.7","unit":"mm"}],"preferred_family":"M3 brass knurled heat set insert, roughly 5 mm OD and 5.7 mm long","why_this_family":"This is the single highest value mechanical part in additive manufacturing. It converts a printed boss into a fastening point that survives repeated assembly, which nothing else in the library does.","typical_applications":["Printed enclosures","Serviceable assemblies","Anything a user will open"],"coverage_note":"The boss hole diameter and the installation temperature are print material dependent. Test on a coupon before committing a part.","required_tooling":[{"name":"Heat set installation tip for a soldering iron","note":"A plain conical tip works badly and will push the insert in crooked. This is a five dollar part that decides whether the whole technique works.","one_time":true},{"name":"A small arbor or drill press to keep it square","note":"Optional, but crooked inserts are the usual failure.","one_time":true}],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-SCREW-PLASTIC","domain":"mechanical","category_path":["Mechanical","Fastener","Self tapping"],"name":"Thread forming screw for plastic","function_summary":"Fasten into a plastic boss without an insert.","key_parameters":[{"name":"Nominal","value":"2.5 to 3","unit":"mm"}],"preferred_family":"Thread forming (30 degree) screws for thermoplastic","why_this_family":"Cheaper and faster than an insert where the joint will be assembled once or twice.","typical_applications":[],"coverage_note":"Thread forming screws are not reusable indefinitely. If a user will open it more than a few times, use the heat set insert slot.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-STANDOFF","domain":"mechanical","category_path":["Mechanical","Fastener","Standoff"],"name":"Hex standoff, M3 and M2.5","function_summary":"Space a board off a surface, stack boards, and mount panels.","key_parameters":[{"name":"Thread","value":"M3 and M2.5","unit":""},{"name":"Lengths","value":"5, 10, 15, 20","unit":"mm"}],"preferred_family":"Brass or nylon hex standoff, male to female and female to female","why_this_family":"Standoffs are the mechanical glue of board level assembly and they are commodity items with deep second sourcing.","typical_applications":[],"coverage_note":"Nylon standoffs are the right answer where isolation matters. Brass is the right answer where thermal or ground continuity matters. Decide deliberately.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-SETSCREW","domain":"mechanical","category_path":["Mechanical","Fastener","Set screw"],"name":"Set screw, M3 and M4","function_summary":"Lock a hub, pulley or coupler onto a shaft.","key_parameters":[{"name":"Thread","value":"M3 and M4","unit":""},{"name":"Point","value":"cup or flat","unit":""}],"preferred_family":"ISO 4029 cup point socket set screw","why_this_family":"Cup point is the general purpose choice and it is what almost every pulley and coupler ships expecting.","typical_applications":[],"coverage_note":"A set screw on a round shaft will eventually slip. A flat on the shaft is part of this design decision, not an optional extra.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-DOWEL","domain":"mechanical","category_path":["Mechanical","Fastener","Pin"],"name":"Dowel pin, 3 mm and 4 mm","function_summary":"Locate two parts to each other precisely, so the screws only clamp.","key_parameters":[{"name":"Diameter","value":"3 and 4","unit":"mm"},{"name":"Tolerance","value":"m6","unit":""}],"preferred_family":"ISO 2338 hardened parallel dowel pin","why_this_family":"Separating location from clamping is the cheapest precision improvement available in an assembly, and dowel pins are commodity.","typical_applications":[],"coverage_note":"The hole tolerance carries the precision, not the pin. If you cannot hold the hole, the pin buys you nothing.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-BEARING-608","domain":"mechanical","category_path":["Mechanical","Bearing and motion","Ball bearing"],"name":"Deep groove ball bearing, maker sizes","function_summary":"Rotational support for shafts, idlers, wheels and pulleys.","key_parameters":[{"name":"Sizes","value":"608, 623, 624, 625, 688","unit":""},{"name":"Seals","value":"2RS rubber or ZZ metal","unit":""}],"preferred_family":"Metric deep groove ball bearings, 608 (8 x 22 x 7) as the house size","why_this_family":"608 is the skateboard bearing. It is the most produced bearing size in the world, available anywhere, and cheap. The smaller 62x sizes cover idlers and small shafts on the same bore ladder.","typical_applications":["Idler pulleys","Wheels","Rotary joints"],"coverage_note":"This library does not do bearing life calculation. Anything carrying real load or speed needs an L10 calculation from the manufacturer data.","required_tooling":[{"name":"Arbor press or a bearing drift set","note":"Pressing on the outer race to seat an inner race fit is how bearings get ruined.","one_time":true}],"family_ladder":[],"numbering_scheme":"The designation encodes the size: 608 is 8 mm bore, 22 mm outside diameter, 7 mm wide. 623 is 3 x 10 x 4. 625 is 5 x 16 x 5. Suffix 2RS is rubber sealed, ZZ is metal shielded.","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-BUSHING","domain":"mechanical","category_path":["Mechanical","Bearing and motion","Bushing"],"name":"Plain bushing, sintered bronze or polymer","function_summary":"Low cost rotational or sliding support where a ball bearing is overkill.","key_parameters":[{"name":"Bore","value":"3 to 8","unit":"mm"}],"preferred_family":"Flanged sleeve bushing, metric bore matching the bearing ladder","why_this_family":"Quieter and more tolerant of misalignment and contamination than a cheap ball bearing, with no cage to fail.","typical_applications":[],"coverage_note":"PV limits govern. A bushing running dry at speed will fail quickly.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-LINEAR-ROD","domain":"mechanical","category_path":["Mechanical","Bearing and motion","Linear motion"],"name":"Linear rod and linear bushing","function_summary":"Low cost linear guidance for light loads.","key_parameters":[{"name":"Diameter","value":"8","unit":"mm"},{"name":"Bushing","value":"LM8UU","unit":""}],"preferred_family":"8 mm hardened chrome rod with LM8UU linear ball bushings","why_this_family":"The 8 mm rod plus LM8UU pair is the most available linear motion combination in the maker world, driven by a decade of 3D printer production.","typical_applications":[],"coverage_note":"Linear ball bushings on rod are compliant and noisy compared with a profile rail. For anything positioning critical, use the rail slot.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-LINEAR-RAIL","domain":"mechanical","category_path":["Mechanical","Bearing and motion","Linear motion"],"name":"Profile linear rail and carriage","function_summary":"Precise, stiff linear guidance.","key_parameters":[{"name":"Sizes","value":"MGN9, MGN12","unit":""},{"name":"Carriage","value":"H long body","unit":""}],"preferred_family":"MGN9 and MGN12 miniature profile rail with H carriages","why_this_family":"MGN rails are the smallest profile rails with a broad, competitive supply base, and the mounting hole pattern is well documented.","typical_applications":[],"coverage_note":"Rail flatness depends entirely on the surface it is bolted to. The rail does not fix a bent frame.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-LEADSCREW","domain":"mechanical","category_path":["Mechanical","Bearing and motion","Linear motion"],"name":"Lead screw and nut","function_summary":"Convert rotation into linear motion.","key_parameters":[{"name":"Size","value":"T8","unit":""},{"name":"Lead","value":"2 or 8","unit":"mm per revolution"}],"preferred_family":"T8 trapezoidal lead screw with a brass or anti backlash nut","why_this_family":"T8 is the maker standard, pairs directly with a NEMA 17 shaft coupler, and both lead options are widely stocked.","typical_applications":[],"coverage_note":"Lead determines speed and holding behaviour. An 8 mm lead can back drive, a 2 mm lead usually will not. This is a design decision, not a substitution.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-BELT-GT2","domain":"mechanical","category_path":["Mechanical","Bearing and motion","Belt and pulley"],"name":"Timing belt and pulley, GT2","function_summary":"Low backlash rotary to linear or rotary to rotary power transmission.","key_parameters":[{"name":"Pitch","value":"2","unit":"mm"},{"name":"Width","value":"6","unit":"mm"},{"name":"Bore","value":"5","unit":"mm"}],"preferred_family":"GT2 2 mm pitch, 6 mm wide belt with 20 tooth aluminium pulleys, 5 mm bore","why_this_family":"GT2 6 mm is the most available timing belt system in maker scale, the 20 tooth pulley matches the common motor shaft, and the 5 mm bore matches NEMA 17.","typical_applications":["Motion platforms","Camera sliders","Rotary indexing"],"coverage_note":"Belt tension is the whole design. Provide an adjustable idler or a tensioner from the outset.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-COUPLER","domain":"mechanical","category_path":["Mechanical","Bearing and motion","Coupling"],"name":"Flexible shaft coupler","function_summary":"Connect a motor shaft to a driven shaft while tolerating small misalignment.","key_parameters":[{"name":"Bores","value":"5 to 8","unit":"mm"},{"name":"Type","value":"helical cut or jaw","unit":""}],"preferred_family":"Aluminium helical cut coupler, 5 mm to 8 mm","why_this_family":"The 5 mm to 8 mm combination connects a NEMA 17 shaft to a T8 lead screw, which is the single most common coupling in maker motion systems.","typical_applications":[],"coverage_note":"A flexible coupler tolerates misalignment, it does not correct it. Persistent misalignment kills bearings.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-EXTRUSION","domain":"mechanical","category_path":["Mechanical","Structure","Extrusion"],"name":"Aluminium T slot extrusion, 20 series","function_summary":"Frames, jigs, mounts and machine structure that can be revised without remaking parts.","key_parameters":[{"name":"Profile","value":"20 x 20 and 20 x 40","unit":"mm"},{"name":"Slot","value":"6","unit":"mm"}],"preferred_family":"20 series, 6 mm slot, metric","why_this_family":"20 series is the smallest profile with a complete accessory ecosystem, and 6 mm slot hardware is the most widely stocked variant. Committing to one slot width is what makes the accessory inventory manageable.","typical_applications":["Test jigs","Machine frames","Camera and lighting rigs","Shop fixtures"],"coverage_note":"Slot width is not interchangeable between vendors and series. A 20 x 20 profile with a 5 mm slot will not take 6 mm slot hardware. Verify the slot before mixing suppliers.","required_tooling":[{"name":"End tap drill jig for 20 series","note":"Squareness of the end tap decides whether the frame is square.","one_time":true},{"name":"M5 tap","note":"For end tapping the extrusion itself.","one_time":true}],"family_ladder":[],"numbering_scheme":"Described by profile dimensions and slot width, for example 2020 with a 6 mm slot. Cut length is specified separately.","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-SHEET-ALU","domain":"mechanical","category_path":["Mechanical","Structure","Sheet stock"],"name":"Aluminium sheet and plate","function_summary":"Brackets, panels, heat spreaders and structural plates.","key_parameters":[{"name":"Alloy","value":"6061-T6 and 5052-H32","unit":""},{"name":"Thickness","value":"1.5, 3, 6","unit":"mm"}],"preferred_family":"6061-T6 for machined parts, 5052-H32 for bent parts","why_this_family":"6061 machines and taps cleanly. 5052 bends without cracking. Choosing the wrong one is the most common sheet metal mistake, so both are in the library with the reason attached.","typical_applications":["Panels","Brackets","Heat spreaders"],"coverage_note":"Bend radius and grain direction matter. This slot is stock selection only, not bend design.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-SHEET-PLASTIC","domain":"mechanical","category_path":["Mechanical","Structure","Sheet stock"],"name":"Plastic sheet stock","function_summary":"Panels, windows, guards, wear surfaces and laser cut parts.","key_parameters":[{"name":"Materials","value":"cast acrylic, polycarbonate, HDPE, acetal","unit":""},{"name":"Thickness","value":"3, 6","unit":"mm"}],"preferred_family":"3 mm and 6 mm sheet in four materials with distinct jobs","why_this_family":"Four materials cover almost everything: cast acrylic laser cuts beautifully and cracks, polycarbonate is tough and will not laser cut cleanly, HDPE is chemically inert and will not glue, acetal machines superbly and will not glue either. Keeping all four with their limits attached prevents the classic wrong material choice.","typical_applications":[],"coverage_note":"Polycarbonate must not be laser cut. It chars, discolours and releases unpleasant products. Route or saw it instead.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-SHEET-WOOD","domain":"mechanical","category_path":["Mechanical","Structure","Sheet stock"],"name":"Plywood and MDF, machine friendly thicknesses","function_summary":"Enclosures, jigs, fixtures, templates and prototype structure.","key_parameters":[{"name":"Thickness","value":"3, 6, 12","unit":"mm"},{"name":"Types","value":"Baltic birch, MDF","unit":""}],"preferred_family":"Baltic birch plywood and MDF in 3, 6 and 12 mm","why_this_family":"Void free birch plywood cuts and screws predictably. MDF is dimensionally consistent and cheap for jigs and templates. Sticking to three thicknesses means the finger joint and pocket libraries stay reusable.","typical_applications":["Laser cut enclosures","CNC fixtures","Router templates"],"coverage_note":"Nominal thickness is not actual thickness. Measure every sheet before generating joinery.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-ORING","domain":"mechanical","category_path":["Mechanical","Sealing","O ring"],"name":"O ring, AS568 common subset","function_summary":"Static face and bore sealing in enclosures and fluid paths.","key_parameters":[{"name":"Material","value":"Buna-N 70A","unit":""},{"name":"Standard","value":"AS568","unit":""}],"preferred_family":"AS568 dash sizes, Buna-N 70 durometer","why_this_family":"AS568 is a published dimensional standard, which means the groove geometry is documented and every supplier sells the same part.","typical_applications":[],"coverage_note":"Buna-N is wrong for ozone, many solvents and high temperature. Viton and silicone are separate decisions.","required_tooling":[],"family_ladder":[],"numbering_scheme":"Specified by AS568 dash number, for example AS568-012, plus material and durometer.","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-TAPE-VHB","domain":"mechanical","category_path":["Mechanical","Adhesion","Tape"],"name":"Structural double sided tape","function_summary":"Permanent bonding of panels, badges and sensors without fasteners.","key_parameters":[{"name":"Type","value":"acrylic foam and high strength transfer","unit":""}],"preferred_family":"Acrylic foam tape for gap filling bonds, high strength transfer tape for thin bonds","why_this_family":"These two products cover almost every fastener free bond in maker scale work, and both are stocked everywhere.","typical_applications":["Panel bonding","Sensor mounting","Badge and label attachment"],"coverage_note":"Surface energy governs everything. Untreated polypropylene and polyethylene will not bond without a primer.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-THREADLOCK","domain":"mechanical","category_path":["Mechanical","Adhesion","Threadlocker"],"name":"Anaerobic threadlocker","function_summary":"Keep a fastener from backing out under vibration.","key_parameters":[{"name":"Strength","value":"medium and high","unit":""}],"preferred_family":"Medium strength removable, and high strength permanent","why_this_family":"Medium strength covers almost every serviceable joint. Keeping the high strength grade separately labelled prevents the expensive mistake of permanently locking a screw you will need to remove.","typical_applications":[],"coverage_note":"Threadlocker attacks some plastics. Do not use it near polycarbonate or acrylic.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-ADHESIVE","domain":"mechanical","category_path":["Mechanical","Adhesion","Adhesive"],"name":"General purpose structural adhesive","function_summary":"Bond dissimilar materials where fasteners will not work.","key_parameters":[{"name":"Types","value":"two part epoxy, cyanoacrylate","unit":""}],"preferred_family":"Two part epoxy for structure, cyanoacrylate for fixturing","why_this_family":"Epoxy fills gaps and carries load. Cyanoacrylate is fast and brittle and is best treated as a clamping aid rather than a structural adhesive.","typical_applications":[],"coverage_note":"Neither bonds polyethylene, polypropylene or PTFE without surface treatment.","required_tooling":[{"name":"Mixing nozzles or a mixing surface and spatula","note":"Two part adhesive mixed by eye on a scrap of card is how most epoxy joints fail.","one_time":false}],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-THERMAL","domain":"mechanical","category_path":["Mechanical","Thermal","Interface"],"name":"Thermal interface material","function_summary":"Move heat from a component into a heat sink or a chassis.","key_parameters":[{"name":"Types","value":"gap pad, paste","unit":""}],"preferred_family":"Silicone gap pad for tolerance taking joints, paste for flat metal to metal","why_this_family":"A gap pad tolerates the surface variation of a printed or bent part, where paste needs flat, well clamped surfaces to work at all.","typical_applications":[],"coverage_note":"Thermal interface material is the last resort. Contact area and clamping pressure matter more than the material choice.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-ENCLOSURE","domain":"mechanical","category_path":["Mechanical","Enclosure","Housing"],"name":"Off the shelf project enclosure","function_summary":"A finished housing so the project does not need a custom mould or a printed shell.","key_parameters":[{"name":"Material","value":"ABS and diecast aluminium","unit":""}],"preferred_family":"Standard series enclosures with published internal dimensions and PCB boss patterns","why_this_family":"Designing the board to a stocked enclosure is enormously cheaper than designing an enclosure to a board, at every volume below several thousand units.","typical_applications":[],"coverage_note":"Sealing ratings only hold with the correct gasket and gland. An IP rating on the catalogue page is not an IP rating on your assembly.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-MAGNET","domain":"mechanical","category_path":["Mechanical","Enclosure","Magnet"],"name":"Neodymium disc magnet","function_summary":"Latching, alignment, and non contact sensing with the hall switch slot.","key_parameters":[{"name":"Grade","value":"N42","unit":""},{"name":"Sizes","value":"6 x 3 and 10 x 3","unit":"mm"}],"preferred_family":"N42 nickel plated disc magnets, 6 x 3 mm and 10 x 3 mm","why_this_family":"Two sizes cover latching and sensing, both are commodity, and the plating survives handling.","typical_applications":["Enclosure lid latches","Tool holders","Position sensing with a hall switch"],"coverage_note":"Neodymium loses strength permanently above roughly 80 degrees C for standard grades. Check the temperature grade before putting one near a motor or a heater.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-GLAND","domain":"mechanical","category_path":["Mechanical","Enclosure","Cable entry"],"name":"Cable gland","function_summary":"Bring a cable through an enclosure wall with strain relief and a seal.","key_parameters":[{"name":"Sizes","value":"M12 and M16","unit":""},{"name":"Cable range","value":"3 to 10","unit":"mm"}],"preferred_family":"Metric nylon glands, M12 and M16","why_this_family":"Metric glands have a defined panel hole size, which means the enclosure hole can be specified before the gland is chosen.","typical_applications":[],"coverage_note":"A gland only seals within its stated cable diameter range. Undersized cable in an oversized gland does not seal.","required_tooling":[{"name":"Step drill or a 16 mm and 20 mm punch","note":"Standardising the gland sizes is what lets one punch set cover every enclosure.","one_time":true}],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-DINRAIL","domain":"mechanical","category_path":["Mechanical","Enclosure","Mounting"],"name":"DIN rail and clips","function_summary":"Mount equipment in a panel or cabinet the way the rest of the industry does.","key_parameters":[{"name":"Rail","value":"TS35 (35 mm top hat)","unit":""}],"preferred_family":"TS35 x 7.5 rail with snap on plastic clips","why_this_family":"TS35 is the universal industrial mounting standard, which makes anything mounted on it installable by an electrician without explanation.","typical_applications":[],"coverage_note":"Clip designs vary in retention force. Test anything that will be transported on the rail.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-FEET","domain":"mechanical","category_path":["Mechanical","Enclosure","Mounting"],"name":"Adhesive bumper feet","function_summary":"Keep an enclosure from sliding and scratching, and provide a little ventilation gap.","key_parameters":[{"name":"Type","value":"polyurethane adhesive bumper","unit":""}],"preferred_family":"Hemispherical and cylindrical polyurethane bumpers","why_this_family":"Commodity item, transformative on perceived build quality, and it costs almost nothing.","typical_applications":[],"coverage_note":"","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-SERVO","domain":"mechanical","category_path":["Mechanical","Actuation","Servo"],"name":"Hobby servo, standard interface","function_summary":"Positional actuation from a single PWM signal.","key_parameters":[{"name":"Interface","value":"50 Hz PWM, 1 to 2 ms","unit":""},{"name":"Sizes","value":"9 g micro and standard","unit":""}],"preferred_family":"Standard three wire hobby servo interface, micro and standard body sizes","why_this_family":"The three wire hobby servo interface is a de facto standard with an enormous supply base and interchangeable mounting for each body size.","typical_applications":["Camera pan and tilt","Latches and valves","Simple robotics"],"coverage_note":"Cheap servos have poor repeatability and no feedback. Anything needing real positional accuracy should use a stepper with an encoder.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-STEPPER","domain":"mechanical","category_path":["Mechanical","Actuation","Stepper motor"],"name":"Stepper motor, NEMA 17","function_summary":"Open loop positioning and controlled motion.","key_parameters":[{"name":"Frame","value":"NEMA 17 (42 mm)","unit":""},{"name":"Step angle","value":"1.8","unit":"degrees"},{"name":"Shaft","value":"5","unit":"mm"}],"preferred_family":"NEMA 17 42 x 42 mm, 1.8 degree, 5 mm shaft, 4 wire bipolar","why_this_family":"The NEMA 17 frame with a 5 mm shaft ties directly into the GT2 pulley and T8 coupler slots, so the whole motion stack is one coherent family.","typical_applications":["Motion platforms","Indexers","Pumps"],"coverage_note":"Holding torque figures assume the motor is driven at rated current with adequate cooling. Real torque falls off with speed.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-SPRING","domain":"mechanical","category_path":["Mechanical","Actuation","Spring"],"name":"Compression and extension springs, common sizes","function_summary":"Return force, preload and detents.","key_parameters":[{"name":"Types","value":"compression, extension, torsion","unit":""}],"preferred_family":"Assortment sourced by outside diameter, free length and wire diameter","why_this_family":"Springs are almost always specified by measurement rather than part number at this scale, so the library records the dimensions that matter rather than pretending there is a single part.","typical_applications":[],"coverage_note":"This library does not do spring rate design. Measure or calculate the rate before committing.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-WIRE-HOOKUP","domain":"mechanical","category_path":["Mechanical","Wire and cable","Wire"],"name":"Hookup wire, 22 to 26 AWG","function_summary":"Point to point wiring, harnesses and jumpers.","key_parameters":[{"name":"Gauge","value":"22, 24, 26","unit":"AWG"},{"name":"Insulation","value":"PVC and silicone","unit":""}],"preferred_family":"Stranded, tinned copper, silicone insulated for flexibility and PVC for economy","why_this_family":"Silicone insulation strips cleanly, survives an iron, and stays flexible, which makes it worth the premium on anything that moves or gets reworked.","typical_applications":["Harnesses","Panel wiring","Sensor leads"],"coverage_note":"Solid core is deliberately limited to breadboard use. Anything that flexes gets stranded.","required_tooling":[],"family_ladder":[],"numbering_scheme":"","status":"active","deprecation_reason":"","superseded_by":""},{"id":"M-HEATSHRINK","domain":"mechanical","category_path":["Mechanical","Wire and cable","Protection"],"name":"Heat shrink tubing","function_summary":"Insulate, strain relieve and seal joints.","key_parameters":[{"name":"Ratio","value":"2:1 and 3:1 adhesive lined","unit":""}],"preferred_family":"2:1 polyolefin for general work, 3:1 adhesive lined for sealed and strain relieved joints","why_this_family":"Two products cover everything. Adhesive lined tubing is the difference between a joint that survives outdoors and one that does not.","typical_applications":[],"coverage_note":"Adhesive lined tubing cannot be removed cleanly. Do not use it where the joint may need rework.","required_tooling":[{"name":"Heat gun with a reflector nozzle","note":"A lighter chars the tubing and a soldering iron melts it unevenly.","one_time":true}],"family_ladder":[],"numbering_scheme":"", <script id="chandler-core">/* CHANDLER core. Pure functions only. No DOM, no storage, no network.
   Everything in here is exercised by the self test. */
var CH = (function () {
  "use strict";

  var DAY = 86400000;

  var DEFAULT_RULES = {
    stalenessDays: 180,
    minDistributors: 2,
    maxMoqForOnes: 10,
    volumeQty: 100,
    maxLeadClassForVolume: "short",
    priceSanityMultiple: 5,
    minRegions: 2,
    allowNrndAsAlternate: true
  };

  function clone(x) { return JSON.parse(JSON.stringify(x)); }

  function parseDate(s) {
    if (!s) return null;
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s).trim());
    if (!m) return null;
    var t = Date.UTC(+m[1], +m[2] - 1, +m[3]);
    var d = new Date(t);
    if (d.getUTCFullYear() !== +m[1] || d.getUTCMonth() !== +m[2] - 1 || d.getUTCDate() !== +m[3]) return null;
    return t;
  }

  function daysBetween(fromISO, toISO) {
    var a = parseDate(fromISO), b = parseDate(toISO);
    if (a === null || b === null) return null;
    return Math.round((b - a) / DAY);
  }

  function ageOf(record, todayISO) {
    return daysBetween(record.observed_on, todayISO);
  }

  function isStale(record, todayISO, rules) {
    var r = rules || DEFAULT_RULES;
    var age = ageOf(record, todayISO);
    if (age === null) return true;
    return age > r.stalenessDays;
  }

  function isSample(record) {
    return !!record.sample;
  }

  /* Fresh sourcing for one orderable: not stale, and (unless allowed) not sample data. */
  function freshSourcing(orderableId, sourcing, todayISO, rules, includeSample) {
    var out = [];
    for (var i = 0; i < sourcing.length; i++) {
      var s = sourcing[i];
      if (s.orderable_id !== orderableId) continue;
      if (isSample(s) && !includeSample) continue;
      if (isStale(s, todayISO, rules)) continue;
      out.push(s);
    }
    return out;
  }

  function uniq(list) {
    var seen = {}, out = [];
    for (var i = 0; i < list.length; i++) {
      var k = String(list[i] || "").trim().toLowerCase();
      if (!k || seen[k]) continue;
      seen[k] = 1; out.push(list[i]);
    }
    return out;
  }

  function unitPriceAt(record, qty) {
    if (!record.price_breaks || !record.price_breaks.length) return null;
    var breaks = record.price_breaks.slice().sort(function (a, b) { return a.qty - b.qty; });
    var price = null;
    for (var i = 0; i < breaks.length; i++) {
      if (breaks[i].qty <= qty) price = breaks[i].price;
    }
    if (price === null) price = breaks[0].price;
    return price;
  }

  function isMultiManufacturerStandard(orderable) {
    var std = orderable.compliance && orderable.compliance.standard ? String(orderable.compliance.standard).trim() : "";
    return std.length > 0;
  }

  var GATES = [
    { id: "multi_source", label: "Multiple sources" },
    { id: "buyable_ones", label: "Buyable in ones" },
    { id: "buyable_hundreds", label: "Buyable in hundreds" },
    { id: "lifecycle", label: "Lifecycle" },
    { id: "hand_workable", label: "Hand workable" },
    { id: "documented", label: "Documented" },
    { id: "price_sanity", label: "Price sanity" },
    { id: "region_reach", label: "Not regionally trapped" }
  ];

  var LEAD_ORDER = { stock: 0, short: 1, long: 2, unknown: 3 };

  /* Returns { gates:[{id,label,verdict,detail}], verdict, sentence, evidence_count } */
  function admissionScore(orderable, sourcing, rules, todayISO, ctx) {
    var r = rules || DEFAULT_RULES;
    ctx = ctx || {};
    var fresh = freshSourcing(orderable.id, sourcing || [], todayISO, r, !!ctx.includeSample);
    var gates = [];

    function push(id, verdict, detail) {
      var label = "";
      for (var i = 0; i < GATES.length; i++) if (GATES[i].id === id) label = GATES[i].label;
      gates.push({ id: id, label: label, verdict: verdict, detail: detail });
    }

    /* 1. multiple sources */
    var dists = uniq(fresh.map(function (s) { return s.distributor; }));
    if (dists.length >= r.minDistributors) {
      push("multi_source", "pass", dists.length + " distinct distributors on current evidence.");
    } else if (isMultiManufacturerStandard(orderable)) {
      push("multi_source", "pass", "Published standard (" + orderable.compliance.standard + "), interchangeable across manufacturers.");
    } else if (fresh.length === 0) {
      push("multi_source", "unknown", "No current sourcing evidence recorded.");
    } else {
      push("multi_source", "fail", "Only " + dists.length + " distributor on current evidence, and no published standard to fall back on.");
    }

    /* 2. buyable in ones */
    var moqs = fresh.filter(function (s) { return typeof s.moq === "number"; }).map(function (s) { return s.moq; });
    if (!moqs.length) {
      push("buyable_ones", "unknown", "No minimum order quantity recorded.");
    } else {
      var minMoq = Math.min.apply(null, moqs);
      if (minMoq <= r.maxMoqForOnes) push("buyable_ones", "pass", "Lowest recorded minimum order quantity is " + minMoq + ".");
      else push("buyable_ones", "fail", "Lowest recorded minimum order quantity is " + minMoq + ", above the limit of " + r.maxMoqForOnes + ".");
    }

    /* 3. buyable in hundreds */
    var vol = null, volLead = null;
    for (var i = 0; i < fresh.length; i++) {
      var s = fresh[i];
      if (!s.price_breaks || !s.price_breaks.length) continue;
      var top = 0;
      for (var j = 0; j < s.price_breaks.length; j++) if (s.price_breaks[j].qty > top) top = s.price_breaks[j].qty;
      if (top >= r.volumeQty) {
        var lead = LEAD_ORDER[s.lead_time_days_class] === undefined ? 3 : LEAD_ORDER[s.lead_time_days_class];
        if (vol === null || lead < volLead) { vol = s; volLead = lead; }
      }
    }
    if (vol === null) {
      push("buyable_hundreds", "unknown", "No price break recorded at " + r.volumeQty + " or above.");
    } else if (volLead > LEAD_ORDER[r.maxLeadClassForVolume]) {
      push("buyable_hundreds", "fail", "A break at " + r.volumeQty + " exists but the lead time class is " + vol.lead_time_days_class + ".");
    } else {
      push("buyable_hundreds", "pass", "Price break at " + r.volumeQty + " from " + vol.distributor + ", lead time class " + vol.lead_time_days_class + ".");
    }

    /* 4. lifecycle */
    var lc = orderable.lifecycle || "unknown";
    if (lc === "active") push("lifecycle", "pass", "Manufacturer lifecycle recorded as active.");
    else if (lc === "obsolete") push("lifecycle", "fail", "Obsolete parts are never admitted.");
    else if (lc === "nrnd") {
      if (r.allowNrndAsAlternate && orderable.role === "alternate") push("lifecycle", "pass", "Not recommended for new designs, admitted as an alternate only and flagged.");
      else push("lifecycle", "fail", "Not recommended for new designs. Admissible only in the alternate role.");
    } else push("lifecycle", "unknown", "Lifecycle not recorded.");

    /* 5. hand workable */
    if (orderable.hand_workable === true) push("hand_workable", "pass", orderable.hand_workable_note || "Placeable and assemblable with common shop tooling.");
    else if (orderable.hand_workable === false) push("hand_workable", "fail", orderable.hand_workable_note || "Not workable with common shop tooling.");
    else push("hand_workable", "unknown", "Not assessed.");

    /* 6. documented */
    var hasDS = orderable.datasheet_url && String(orderable.datasheet_url).trim().length > 0;
    var hasStd = isMultiManufacturerStandard(orderable);
    var seen = null;
    for (var ds = 0; ds < fresh.length; ds++) if (fresh[ds].datasheet_seen) { seen = fresh[ds]; break; }
    if (hasDS) push("documented", "pass", "Datasheet recorded against the part.");
    else if (hasStd) push("documented", "pass", "Published dimensional standard: " + orderable.compliance.standard + ".");
    else if (seen) push("documented", "pass", "Datasheet confirmed on the " + (seen.distributor || "distributor") + " page by " + (seen.observer || "an observer") + " on " + seen.observed_on + ".");

      push("price_sanity", "unknown", "Not enough priced parts in this category to form a median.");
    } else if (unit <= ctx.categoryMedian * r.priceSanityMultiple) {
      push("price_sanity", "pass", "Unit price at " + r.volumeQty + " is within " + r.priceSanityMultiple + "x the category median.");

    if (regions.length >= r.minRegions) push("region_reach", "pass", "Evidence from " + regions.length + " regions.");

    else if (fresh.length === 0) push("region_reach", "unknown", "No current sourcing evidence recorded.");

    else if (verdict === "excluded") sentence = "Excluded. " + fails + " gate" + (fails === 1 ? "" : "s") + " fail" + (fails === 1 ? "s" : "") + ", so this part goes to the Waiting Room until the evidence changes.";
    else sentence = "Unverified. Nothing fails, but " + unknowns + " gate" + (unknowns === 1 ? " is" : "s are") + " unknown for want of evidence.";

  }

  function median(nums) {

  /* Median unit price at volumeQty across every orderable sharing the slot's top two category levels. */
  function categoryMedian(orderable, lib, rules, todayISO, includeSample) {
    var r = rules || DEFAULT_RULES;
    var slot = findSlot(lib, orderable.slot_id);
    if (!slot) return null;
    var key = slot.category_path.slice(0, 2).join(" / ");
    var prices = [];
    for (var i = 0; i < lib.orderables.length; i++) {
      var o = lib.orderables[i];
      var s2 = findSlot(lib, o.slot_id);
      if (!s2 || s2.category_path.slice(0, 2).join(" / ") !== key) continue;
      var fresh = freshSourcing(o.id, lib.sourcing, todayISO, r, includeSample);
      var best = null;
      for (var j = 0; j < fresh.length; j++) {

  function findSlot(lib, id) {

  /* ---------- validation ---------- */

      seenO[o.id] = 1;
      if (!seen[o.slot_id]) errors.push("Orderable " + o.id + " points at a slot that does not exist: " + o.slot_id);
      if (!o.mpn) errors.push("Orderable " + o.id + " has no part number.");

      }

      if (!String(c.mpn || "").trim()) errors.push("Candidate " + (i + 1) + " has no part number.");
      if (!String(c.reason || "").trim()) errors.push("Candidate " + (c.mpn || i + 1) + " records no reason for being rejected, which is the only thing that makes it worth keeping.");
    });

      if (!parseDate(s.observed_on)) errors.push("Sourcing record " + (i + 1) + " has no valid observed date.");

  }

  /* ---------- pack merge ---------- */

  var COLLECTIONS = ["slots", "orderables", "sourcing", "candidates"];

    diff.changes.forEach(function (d) { if (take(d.kind, d.key, d.incoming)) applied++; });

  /* ---------- CSV ---------- */

  function csvEscape(v) {

          inQ = false; i++; continue;
        }
        field += c; i++; continue;

      if (c === '"') { inQ = true; i++; continue; }
      if (c === ",") { row.push(field); field = ""; i++; continue; }
      if (c === "\r") { i++; continue; }
      if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; i++; continue; }
      field += c; i++;

    if (field.length || row.length) { row.push(field); rows.push(row); }

  }

  /* TALLY BOM CSV. Header tokens must be exactly these, in this order. */
  var TALLY_HEADER = ["ref", "mpn", "description", "qty"];

  function toTallyCSV(lines) {
    var rows = [TALLY_HEADER.slice()];
    lines.forEach(function (l) {
      rows.push([l.ref || "", l.mpn || "", l.description || "", l.qty === undefined ? 1 : l.qty]);
    });
    return toCSV(rows);
  }

  function toTallyJob(lines, buildQty, meta) {
    return {
      meta: meta || { source: "CHANDLER", exported_on: "" },
      buildQty: buildQty || 1,
      bom: lines.map(function (l) {
        return {
          ref: l.ref || "",
          mpn: l.mpn || "",
          desc: l.description || "",
          qtyPer: l.qty === undefined ? 1 : l.qty,
          offers: (l.offers || []).map(function (o) {
            return {
              vendor: o.vendor || "",
              sku: o.sku || "",
              moq: typeof o.moq === "number" ? o.moq : 1,
              pack: typeof o.pack === "number" ? o.pack : 1,
              leadDays: typeof o.leadDays === "number" ? o.leadDays : 0,
              stock: typeof o.stock === "number" ? o.stock : 0,

  /* Currency is deliberately not carried into the job: TALLY is single currency. */
  function offersFromSourcing(records) {
    return records.map(function (s) {

        vendor: s.distributor || "",
        sku: s.distributor_sku || "",
        moq: typeof s.moq === "number" ? s.moq : 1,
        pack: typeof s.pack_qty === "number" ? s.pack_qty : 1,
        leadDays: typeof s.lead_time_days === "number" ? s.lead_time_days : 0,
        stock: typeof s.stock_observed === "number" ? s.stock_observed : 0,

      };
    });
  }

  /* ---------- stock plan ---------- */

  function stockPlan(items, builds) {
    var b = Math.max(0, Math.floor(builds || 0));
    return items.map(function (it) {
      var need = (it.qtyPer || 0) * b;
      var pack = it.pack && it.pack > 0 ? it.pack : 1;
      var moq = it.moq && it.moq > 0 ? it.moq : 1;
      var order = need;
      if (order > 0 || moq > 0) {
        order = Math.ceil(need / pack) * pack;
        if (need > 0 && order < moq) order = Math.ceil(moq / pack) * pack;
      }
      if (need === 0) order = 0;
      return {
        mpn: it.mpn, description: it.description || "", distributor: it.distributor || "",
        needed: need, pack: pack, moq: moq, order_qty: order, overage: order - need

    });
  }

  /* ---------- evidence ergonomics ---------- */

  /* Accepts "1:0.10, 100:0.04", "1:0.10; 100:0.04" or "1@0.10 100@0.04". */
  function parseLadder(text) {
    var out = [];

      var m = /^(\d+)[:@]([0-9]*\.?[0-9]+)$/.exec(chunk.trim());

  }
  function ladderToText(record) {

    return record.price_breaks.map(function (b) { return b.qty + ":" + b.price; }).join("; ");
  }

  function daysUntilStale(record, todayISO, rules) {

  }

  /* What needs a human to go and look, worst first.

  function verificationQueue(lib, rules, todayISO, includeSample) {
    var r = rules || DEFAULT_RULES;
    var out = [];
    lib.orderables.forEach(function (o) {
      if (o.archived) return;
      var all = (lib.sourcing || []).filter(function (s) {
        return s.orderable_id === o.id && (includeSample || !isSample(s));
      });
      var fresh = freshSourcing(o.id, lib.sourcing || [], todayISO, r, includeSample);
      var soonest = null;
      fresh.forEach(function (s) {
        var d = daysUntilStale(s, todayISO, r);

      var reason, priority;

      else if (!fresh.length) { reason = "overdue"; priority = 1; }

        days_until_stale: soonest, reason: reason, priority: priority

  var WORKSHEET_HEADER = ["mpn", "slot", "distributor", "sku", "region", "observed_on", "stock",

  /* Reads a filled worksheet, or any CSV with the same column names, back into sourcing records.

  function parseEvidenceCsv(text, lib, defaults) {
    var d = defaults || {};

    if (!rows.length) return { records: [], skipped: [{ row: 0, reason: "The file has no rows in it." }], blank: 0, datasheets: [] };
    var head = rows[0].map(function (h) { return String(h).trim().toLowerCase().replace(/\s+/g, "_"); });
    function col(name) { return head.indexOf(name); }

    }

  /* Adds records, replacing any existing record with the same natural key. */
  function mergeSourcing(lib, records) {

  /* ---------- BOM coverage check ---------- */

    var covered = [], alternate = [], uncovered = [];
    rows.forEach(function (r) {

  /* ---------- tooling ---------- */

  /* The tools a set of chosen parts quietly assumes you own. The crimp tool is

  function toolingFor(slotIds, lib) {
    var seen = {}, out = [];

      slot.required_tooling.forEach(function (t) {
        var key = String(t.name || "").trim().toLowerCase();

        if (seen[key].slots.indexOf(slot.name) === -1) seen[key].slots.push(slot.name);

    });
    out.sort(function (a, b) {
      if (a.one_time !== b.one_time) return a.one_time ? -1 : 1;
      if (a.slots.length !== b.slots.length) return b.slots.length - a.slots.length;
      return String(a.name).localeCompare(String(b.name));
    });
    return out;
  }

  /* ---------- coverage runs ---------- */

  /* A run is a dated measurement, kept so coverage becomes a tracked number
     instead of a claim. Only the part numbers are kept, never the whole BOM. */
  function coverageRun(rows, lib, meta) {
    var cov = coverageCheck(rows, lib);
    var m = meta || {};
    return {
      id: m.id || ("CR-" + (m.ran_on || "") + "-" + Math.random().toString(36).slice(2, 8)),
      name: String(m.name || "unnamed BOM").trim() || "unnamed BOM",
      ran_on: m.ran_on || "",
      total: cov.total,
      covered: cov.covered.length,
      fraction: cov.fraction,
      covered_mpns: cov.covered.map(function (c) { return c.row.mpn; }),
      uncovered_mpns: cov.uncovered.map(function (u) { return u.row.mpn; })
    };
  }

  /* Part numbers that keep turning up in BOMs and are not in the library.
     This is the list that tells you what to curate next. */
  function recurringGaps(runs) {
    var seen = {};
    (runs || []).forEach(function (run) {
      var once = {};
      (run.uncovered_mpns || []).forEach(function (mpn) {
        var key = normalizeMpn(mpn);
        if (!key || once[key]) return;
        once[key] = 1;
        if (!seen[key]) seen[key] = { mpn: mpn, count: 0, runs: [] };
        seen[key].count += 1;
        seen[key].runs.push(run.name);
      });
    });
    return Object.keys(seen).map(function (k) { return seen[k]; })
      .sort(function (a, b) {
        if (a.count !== b.count) return b.count - a.count;
        return String(a.mpn).localeCompare(String(b.mpn));
      });
  }

  function coverageTrend(runs) {
    var list = (runs || []).slice().sort(function (a, b) { return String(a.ran_on).localeCompare(String(b.ran_on)); });
    if (!list.length) return { runs: 0, lines: 0, covered: 0, fraction: null, best: null, worst: null, latest: null, first: null };
    var lines = 0, covered = 0, best = null, worst = null;
    list.forEach(function (r) {
      lines += r.total; covered += r.covered;
      if (best === null || r.fraction > best.fraction) best = r;
      if (worst === null || r.fraction < worst.fraction) worst = r;
    });

      runs: list.length, lines: lines, covered: covered,
      fraction: lines ? covered / lines : null,
      best: best, worst: worst,
      first: list[0], latest: list[list.length - 1]
    };
  }

  /* ---------- candidates: parts looked at and rejected ---------- */

  function candidateFor(mpn, lib) {
    var key = normalizeMpn(mpn);
    var hits = (lib.candidates || []).filter(function (c) { return normalizeMpn(c.mpn) === key && !c.archived; });
    return hits.length ? hits[0] : null;
  }

  /* ---------- library health ---------- */

  function libraryHealth(lib, rules, todayISO, includeSample) {
    var r = rules || DEFAULT_RULES;
    var slots = lib.slots.filter(function (s) { return !s.archived; });
    var orderables = lib.orderables.filter(function (o) { return !o.archived; });
    var withOrd = {}, ages = [];
    orderables.forEach(function (o) { withOrd[o.slot_id] = 1; });
    var counts = { admitted: 0, unverified: 0, excluded: 0 };
    var medianCache = {};
    orderables.forEach(function (o) {
      var slot = findSlot(lib, o.slot_id);
      var key = slot ? slot.category_path.slice(0, 2).join(" / ") : "?";
      if (!(key in medianCache)) medianCache[key] = categoryMedian(o, lib, r, todayISO, includeSample);
      var res = admissionScore(o, lib.sourcing || [], r, todayISO, {
        includeSample: includeSample, categoryMedian: medianCache[key]
      });
      counts[res.verdict]++;
    });
    (lib.sourcing || []).forEach(function (s) {
      if (!includeSample && isSample(s)) return;
      var a = ageOf(s, todayISO);
      if (a !== null) ages.push(a);
    });
    var twoSource = 0;
    slots.forEach(function (s) {
      var os = orderables.filter(function (o) { return o.slot_id === s.id; });
      if (os.length >= 2) twoSource++;
    });
    return {
      slots: slots.length,
      orderables: orderables.length,
      provisional: slots.filter(function (s) { return s.status === "provisional"; }).length,
      slots_with_orderables: Object.keys(withOrd).length,
      slots_with_two_or_more: twoSource,
      verdicts: counts,
      evidence_records: ages.length,
      median_evidence_age_days: median(ages),
      stale_records: (lib.sourcing || []).filter(function (s) { return (includeSample || !isSample(s)) && isStale(s, todayISO, r); }).length
    };
  }

  return {
    DAY: DAY,
    DEFAULT_RULES: DEFAULT_RULES,
    GATES: GATES,
    TALLY_HEADER: TALLY_HEADER,
    clone: clone,
    parseDate: parseDate,
    daysBetween: daysBetween,
    ageOf: ageOf,
    isStale: isStale,
    isSample: isSample,
    freshSourcing: freshSourcing,
    unitPriceAt: unitPriceAt,
    admissionScore: admissionScore,
    median: median,
    categoryMedian: categoryMedian,
    findSlot: findSlot,
    findOrderable: findOrderable,
    orderablesFor: orderablesFor,
    validateLibrary: validateLibrary,
    diffPack: diffPack,
    applyMerge: applyMerge,
    toCSV: toCSV,
    parseCSV: parseCSV,
    toTallyCSV: toTallyCSV,
    toTallyJob: toTallyJob,
    offersFromSourcing: offersFromSourcing,
    stockPlan: stockPlan,
    coverageCheck: coverageCheck,
    normalizeMpn: normalizeMpn,
    libraryHealth: libraryHealth,
    parseLadder: parseLadder,
    ladderToText: ladderToText,
    daysUntilStale: daysUntilStale,
    verificationQueue: verificationQueue,
    WORKSHEET_HEADER: WORKSHEET_HEADER,
    worksheetCsv: worksheetCsv,
    parseEvidenceCsv: parseEvidenceCsv,
    mergeSourcing: mergeSourcing,

    eq("merging a pack with itself reports everything unchanged", d2.unchanged.length, 1);
    var packEdit = { slots: [{ id: "S1", name: "One renamed", category_path: ["A"] }] };
    var d3 = CH.diffPack(base, packEdit);

    eq("the changed field is identified", d3.changes[0].fields, ["name"]);
    var rejected = CH.applyMerge(base, d3, {});
