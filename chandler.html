  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.app{--bg:#111311;--panel:#171a17;--p2:#1d211d;--line:#343a33;--text:#f1eee4;--muted:#aaa99f;--faint:#73776f;--accent:#e78536;--green:#78a989;--amber:#d4a451;min-height:100vh;background:var(--bg);color:var(--text);display:grid;grid-template-columns:220px 1fr;grid-template-rows:60px 1fr 26px}.app.light{--bg:#ebe9e1;--panel:#f7f5ee;--p2:#eeebe2;--line:#c9c5b9;--text:#20231f;--muted:#5e635b;--faint:#777b73;--accent:#b55c20;--green:#447b58;--amber:#8e671d;color-scheme:light}.top{grid-column:1/-1;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:14px;background:var(--panel)}.brand{display:flex;align-items:center;gap:9px;min-width:192px}.mark{width:31px;height:31px;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font:800 10px ui-monospace}.brand strong{display:block;font:800 13px ui-monospace;letter-spacing:.13em}.brand small{display:block;color:var(--faint);font-size:8px}.top .search{height:36px;max-width:650px;flex:1;border:1px solid var(--line);background:var(--bg);border-radius:7px;display:flex;align-items:center;padding:0 10px}.search input{flex:1;border:0;outline:0;background:transparent;color:var(--text)}.top-actions{margin-left:auto;display:flex;gap:6px}.top-actions button,.mode button{border:1px solid var(--line);background:var(--p2);color:var(--muted);border-radius:5px;padding:7px 9px;font-size:9px;cursor:pointer}.mode button.active{border-color:var(--accent);color:var(--text)}.side{grid-column:1;border-right:1px solid var(--line);background:var(--panel);padding:14px 9px}.side p{color:var(--faint);font:800 8px ui-monospace;text-transform:uppercase;letter-spacing:.14em;padding:0 9px}.side button{width:100%;min-height:37px;border:0;background:transparent;color:var(--muted);text-align:left;border-radius:5px;padding:0 10px;font-size:11px;cursor:pointer}.side button:hover,.side button.active{background:rgba(231,133,54,.12);color:var(--text)}.main{grid-column:2;padding:34px clamp(16px,4vw,56px) 60px;overflow:auto}.status{grid-column:1/-1;position:fixed;bottom:0;left:0;right:0;height:26px;border-top:1px solid var(--line);background:var(--p2);display:flex;align-items:center;gap:16px;padding:0 10px;color:var(--faint);font:8px ui-monospace;z-index:5}.status span:last-child{margin-left:auto;color:var(--accent)}.dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px}.eyebrow{color:var(--accent);font:800 8px ui-monospace;text-transform:uppercase;letter-spacing:.17em}.head{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:16px}.head h1{font:500 clamp(30px,4vw,44px) Georgia,serif;letter-spacing:-.03em;margin:6px 0}.head p{color:var(--muted);font-size:12px;line-height:1.6;margin:0;max-width:720px}.hero{display:flex;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px;margin-bottom:8px}.hero input{flex:1;background:transparent;border:0;outline:0;color:var(--text);padding:0 8px}.hero button,.action{border:0;background:var(--accent);color:#17110b;border-radius:5px;padding:9px 13px;font-size:9px;font-weight:800;cursor:pointer}.examples{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0 20px}.examples button,.tool button,.card footer button,.export button,.curator button{border:1px solid var(--line);background:var(--p2);color:var(--muted);border-radius:4px;padding:6px 8px;font-size:8px;cursor:pointer}.examples button:hover,.tool button:hover,.card footer button:hover,.export button:hover,.curator button:hover{border-color:var(--accent);color:var(--text)}.tool{display:flex;justify-content:space-between;align-items:center;margin:12px 0}.tool div{display:flex;gap:6px}.tool select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:5px;padding:6px;font-size:9px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.card{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:13px;display:flex;flex-direction:column;min-height:330px}.card header{display:flex;justify-content:space-between}.chip{display:inline-block;border:1px solid var(--line);border-radius:3px;padding:3px 5px;color:var(--muted);font:700 7px ui-monospace;text-transform:uppercase}.chip.sample{color:var(--amber)}.card h3{font:500 17px Georgia,serif;margin:11px 0 5px}.card p{color:var(--muted);font-size:9px;line-height:1.5}.specs{margin:5px 0}.specs div{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:6px 0;font-size:8px}.specs span:first-child{color:var(--faint)}.scores{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:auto}.scores span{border-top:2px solid var(--accent);padding-top:5px;color:var(--faint);font-size:7px}.scores b{color:var(--text);font-size:10px;margin-right:3px}.card footer{display:flex;gap:5px;border-top:1px solid var(--line);padding-top:9px;margin-top:9px}.card footer button.active{border-color:var(--accent);color:var(--accent)}.empty{border:1px dashed var(--line);background:var(--panel);padding:60px 20px;text-align:center;border-radius:8px}.empty h3{font:500 20px Georgia,serif}.empty p{color:var(--muted);font-size:10px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:7px;background:var(--panel)}table{border-collapse:collapse;width:100%;min-width:720px;font-size:9px}th,td{border-bottom:1px solid var(--line);padding:9px;text-align:left;vertical-align:top}th{background:var(--p2);color:var(--faint);font:800 8px ui-monospace;text-transform:uppercase}td input,td select,.curator input,.curator textarea{width:100%;background:var(--p2);border:1px solid var(--line);color:var(--text);border-radius:4px;padding:6px}.export{display:flex;gap:6px;padding:10px}.passport{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:16px}.passport h2{font:500 25px Georgia,serif;margin:7px 0}.passport>p{color:var(--muted);font-size:10px;line-height:1.6}.passport section{border-top:1px solid var(--line);padding:11px 0}.passport section h3{font-size:9px;text-transform:uppercase}.warning{border-left:3px solid var(--amber);padding:8px 10px;background:rgba(212,164,81,.08);color:var(--muted);font-size:9px}.curator{display:grid;grid-template-columns:1fr 1fr;gap:10px}.curator article{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:13px}.curator h3{font:500 18px Georgia,serif;margin:0 0 7px}.curator p{color:var(--muted);font-size:9px;line-height:1.5}.curator label{display:grid;gap:5px;color:var(--faint);font-size:8px;margin-bottom:8px}.curator textarea{resize:vertical}.review{border-top:1px solid var(--line);padding:8px 0}.review strong,.review small{display:block}.review small{color:var(--faint);font-size:8px}.review div{display:flex;gap:5px;margin-top:6px}.toast{position:fixed;right:16px;bottom:38px;background:var(--text);color:var(--bg);padding:9px 12px;border-radius:5px;font-size:9px;font-weight:800}.hidden{display:none!important}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.app{grid-template-columns:1fr;grid-template-rows:54px auto 1fr 26px}.top{grid-row:1}.brand{min-width:auto}.brand small,.top .search{display:none}.side{grid-column:1;grid-row:2;display:flex;overflow:auto;padding:6px}.side p{display:none}.side button{width:auto;white-space:nowrap;padding:0 9px}.main{grid-column:1;grid-row:3;padding:22px 12px 50px}.grid,.curator{grid-template-columns:1fr}.status span:nth-child(n+3):not(:last-child){display:none}.hero{display:grid}.hero button{width:100%}}@media(max-width:430px){.grid{grid-template-columns:1fr}.mode button{padding:6px}.top-actions>button{display:none}}@media print{.top,.side,.status,.export{display:none}.app{display:block;background:white;color:#111}.main{padding:0}.head p,td{color:#222}}
  </style>
</head>
<body>
<div class="app" id="app">
  <header class="top"><div class="brand"><span class="mark">CH</span><span><strong>CHANDLER</strong><small>Curated hardware library</small></span></div><div class="search"><input id="global-search" placeholder="Find a part or describe the job…" aria-label="Search catalog"></div><div class="top-actions"><div class="mode"><button data-mode="maker" class="active">Maker</button><button data-mode="curator">Curator</button></div><button id="theme">Theme</button></div></header>
  <nav class="side" id="nav"></nav>
  <main class="main" id="main"></main>
  <footer class="status"><span><i class="dot"></i><b id="network">Online</b></span><span><i class="dot"></i><b id="save">Saved</b></span><span>App v0.1.0</span><span>Catalog 2026.08.24-demo</span><span>Schema 3</span><span id="mode-status">Maker Mode</span></footer>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<script>
const PARTS=[
 {id:"CH-M-000184",name:"M3 × 8 millimeter socket-head cap screw",short:"M3 × 8 SHCS",domain:"Mechanical",category:"Fasteners",desc:"Compact metric machine screw for printed parts, mechanisms, enclosures, and fixtures.",why:"A compact, well-tooled system with nuts, inserts, standoffs, washers, and tapped components.",limit:"Check engagement, material, head clearance, preload, and strength class.",utility:92,common:89,state:"Data checked",aliases:"m3x8 shcs m3 socket bolt 8mm din 912",interfaces:"M3 × 0.5 threaded fastening",specs:{Thread:"M3 × 0.5",Length:"8 mm",Stock:"Unknown",Price:"Unknown"}},
 {id:"CH-M-000242",name:"608 deep-groove ball bearing",short:"608 bearing",domain:"Mechanical",category:"Bearings",desc:"Compact radial bearing envelope for rollers, machines, fixtures, and educational mechanisms.",why:"The 8 × 22 × 7 millimeter envelope has broad support from shafts, wheels, and housings.",limit:"Check closure, clearance, precision, lubricant, fit, load, and speed ratings.",utility:90,common:94,state:"Data checked",aliases:"608zz 608-2rs skate bearing 8x22x7",interfaces:"608 bearing envelope; 8 millimeter round shaft",specs:{Bore:"8 mm",Outside:"22 mm",Width:"7 mm",Stock:"Unknown",Price:"Unknown"}},
 {id:"CH-M-000310",name:"20 × 20 millimeter structural extrusion",short:"2020 extrusion",domain:"Mechanical",category:"Structures",desc:"Modular aluminum profile for frames, guards, rigs, machines, and adjustable fixtures.",why:"Enables rapid reversible assembly with a broad bracket and fastener ecosystem.",limit:"T-slot, V-slot, slot width, cavity, and fastener ecosystems differ.",utility:93,common:86,state:"Data checked",aliases:"2020 extrusion 20mm profile v-slot t-slot",interfaces:"20 millimeter extrusion ecosystem",specs:{Envelope:"20 × 20 mm",Slot:"Ecosystem dependent",Stock:"Unknown",Price:"Unknown"}},
 {id:"CH-M-000344",name:"GT2-profile 6 millimeter timing belt",short:"GT2 belt",domain:"Mechanical",category:"Motion",desc:"Compact synchronous belt for light positioning systems and maker-scale motion axes.",why:"Two millimeter pitch supports compact pulleys and a broad prototyping ecosystem.",limit:"Check width, tooth profile, tension, wrap, speed, tensile member, and torque.",utility:84,common:83,state:"Suggested",aliases:"gt2 belt 2mm pitch 6mm timing belt",interfaces:"GT2 2 millimeter timing profile",specs:{Pitch:"2 mm",Width:"6 mm",Stock:"Unknown",Price:"Unknown"}},
 {id:"CH-E-000042",name:"Adjustable buck-regulator module",short:"Buck module",domain:"Electronic",category:"Power conversion",desc:"Small step-down converter module for a lower regulated direct-current rail.",why:"Validates power architecture quickly before a board-level design is committed.",limit:"Check input, current, ripple, thermals, layout, protection, and authenticity.",utility:91,common:81,state:"Suggested",aliases:"dc dc step down buck converter 5v regulator",interfaces:"Direct-current power",specs:{Input:"Variant dependent",Output:"Adjustable",Current:"Unknown",Stock:"Unknown",Price:"Unknown"}},
 {id:"CH-E-000071",name:"Four-channel bidirectional logic-level shifter module",short:"Logic level shifter",domain:"Electronic",category:"Logic",desc:"Breadboard module for exploring low-speed open-drain translation between 3.3 volt and 5 volt systems.",why:"Convenient for early I²C experiments between mixed-voltage modules.",limit:"Not a universal translator; check direction, edge rate, and thresholds.",utility:74,common:70,state:"Watch",aliases:"5v level shifter 3.3 to 5v i2c converter",interfaces:"5 volt logic; I²C; 2.54 millimeter grid",specs:{Channels:"4",Use:"Open-drain buses",Stock:"Unknown",Price:"Unknown"}},
 {id:"CH-E-000103",name:"ATmega328P Arduino-compatible development board",short:"ATmega328P board",domain:"Electronic",category:"Microcontrollers",desc:"Mature 5 volt development platform with extensive documentation and education support.",why:"Forgiving, well documented, simple to power, and broadly supported.",limit:"Memory, processing, communication, and 5 volt logic may constrain modern products.",utility:88,common:93,state:"Recommended",aliases:"arduino uno compatible 328p dev board uno",interfaces:"5 volt logic; I²C; 2.54 millimeter grid",specs:{Logic:"5 V",Controller:"ATmega328P",Stock:"Unknown",Price:"Unknown"}},
 {id:"CH-EM-000012",name:"NEMA 17 frame stepper motor",short:"NEMA 17 stepper",domain:"Electromechanical",category:"Motors",desc:"Common frame size for small positioning systems, feeders, fixtures, and maker machines.",why:"Broad ecosystem of brackets, couplers, pulleys, and current-regulating drivers.",limit:"Frame size does not define torque, current, winding, shaft, connector, or dynamics.",utility:89,common:90,state:"Data checked",aliases:"42mm stepper nema17 motor 3d printer motor",interfaces:"NEMA 17 mounting envelope",specs:{Frame:"NEMA 17",Torque:"Variant dependent",Current:"Variant dependent",Stock:"Unknown",Price:"Unknown"}}
];
const OBS=[{id:"OBS-00000001",raw:"M3x8 SHCS",candidate:"CH-M-000184",confidence:98},{id:"OBS-00000002",raw:"608ZZ",candidate:"CH-M-000242",confidence:96},{id:"OBS-00000003",raw:"2020 V-slot rail 500mm",candidate:"CH-M-000310",confidence:84}];
const defaults={mode:"maker",view:"discover",theme:"dark",query:"",favorites:[],compare:[],bom:[],decisions:{}};
let state=Object.assign({},defaults,JSON.parse(localStorage.getItem("chandler-portable")||"{}"));
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){const e=$("#toast");e.textContent=t;e.classList.remove("hidden");setTimeout(()=>e.classList.add("hidden"),2200)}
function save(){ $("#save").textContent="Saving"; localStorage.setItem("chandler-portable",JSON.stringify(state)); setTimeout(()=>$("#save").textContent="Saved",180)}
function download(name,text,type="text/plain"){const a=document.createElement("a"),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function setView(v){state.view=v;save();render()}
function nav(){const maker=[["discover","Discover"],["compare","Compare"],["bom","Project BOM"],["mine","My Parts"],["updates","Updates & Backup"],["help","Help"]],curator=[["curator","Overview"],["imports","Imports"],["review","Review Queue"],["rules","Normalization"],["release","Releases"]];$("#nav").innerHTML=`<p>${state.mode==="maker"?"Workbench":"Catalog operations"}</p>`+(state.mode==="maker"?maker:curator).map(([v,l])=>`<button data-view="${v}" class="${state.view===v?"active":""}">${l}${v==="compare"&&state.compare.length?` (${state.compare.length})`:""}${v==="bom"&&state.bom.length?` (${state.bom.length})`:""}</button>`).join("");document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>setView(b.dataset.view))}
function head(k,t,b){return `<header class="head"><span class="eyebrow">${k}</span><h1>${t}</h1><p>${b}</p></header>`}
function discover(){let q=state.query.toLowerCase().replace(/bearing.*8\s*mm.*shaft/,"608 bearing").replace(/join.*20\s*mm.*extrusion/,"2020 extrusion").replace(/temperature.*arduino/,"arduino");let rows=PARTS.filter(p=>!q||q.split(/\s+/).every(x=>(p.name+" "+p.desc+" "+p.aliases+" "+p.interfaces).toLowerCase().includes(x)));return head("Maker workbench","What are you trying to build?","Describe the job, a size, an interface, or a known part. Common use and engineering recommendation stay separate.")+`<div class="hero"><input id="hero-q" value="${esc(state.query)}" placeholder="Try “bearing for an 8 mm shaft”"><button id="go">Search catalog</button></div><div class="examples">${["Bearing for an 8 mm shaft","Join two pieces of 20 mm extrusion","5 V level shifter","NEMA 17 motor"].map(x=>`<button data-q="${x}">${x}</button>`).join("")}</div><div class="tool"><span class="eyebrow">${rows.length} curated families</span><div><select id="domain"><option>All domains</option><option>Mechanical</option><option>Electronic</option><option>Electromechanical</option></select></div></div>${rows.length?`<div class="grid">${rows.map(card).join("")}</div>`:`<div class="empty"><h3>No family matches every term</h3><p>Try a broader job description or search a nominal interface.</p><button class="action" data-q="">Reset search</button></div>`}`}
function card(p){return `<article class="card"><header><span class="chip">${p.domain}</span><span class="chip sample">Sample</span></header><h3>${p.name}</h3><p>${p.desc}</p><div class="specs">${Object.entries(p.specs).slice(0,3).map(([k,v])=>`<div><span>${k}</span><span>${v}</span></div>`).join("")}</div><div class="scores"><span><b>${p.utility}</b>Utility · demo</span><span><b>${p.common}</b>Common · demo</span></div><footer><button data-open="${p.id}">Passport</button><button data-fav="${p.id}" class="${state.favorites.includes(p.id)?"active":""}">★ Save</button><button data-compare="${p.id}" class="${state.compare.includes(p.id)?"active":""}">⇄ Compare</button><button data-bom="${p.id}">+ Project</button></footer></article>`}
function passport(id){const p=PARTS.find(x=>x.id===id);return head("Part Passport",p.name,p.id)+`<article class="passport"><span class="chip">${p.state}</span> <span class="chip sample">Demonstration record</span><h2>${p.short}</h2><p>${p.desc}</p><div class="warning"><b>Verify before committing</b><br>${p.limit}</div><section><h3>Why makers reach for it</h3><p>${p.why}</p></section><section><h3>Normalized specifications</h3><div class="specs">${Object.entries(p.specs).map(([k,v])=>`<div><span>${k}</span><span>${v}</span></div>`).join("")}</div></section><section><h3>Interfaces</h3><p>${p.interfaces}</p></section><section><h3>Evidence state</h3><p>Scores are demonstration values, not published census results. Price and stock are Unknown.</p></section><button class="action" id="back">Back to results</button></article>`}
function compare(){const ps=state.compare.map(id=>PARTS.find(p=>p.id===id)).filter(Boolean);return head("Maker workbench","Compare","Review differences, limitations, interfaces, and missing evidence side by side.")+(!ps.length?`<div class="empty"><h3>Nothing to compare</h3><p>Choose Compare on any catalog card.</p><button class="action" data-view="discover">Browse parts</button></div>`:`<div class="table-wrap"><table><thead><tr><th>Attribute</th>${ps.map(p=>`<th>${p.short}<br><button data-compare="${p.id}">Remove</button></th>`).join("")}</tr></thead><tbody>${["domain","category","state","interfaces","utility","common","limit"].map(k=>`<tr><th>${k}</th>${ps.map(p=>`<td>${k==="utility"||k==="common"?p[k]+" / 100 · demo":p[k]}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`)}
function bom(){return head("Project workspace","Bench Supply","Edit quantities and preserve the selected catalog state in exported project baselines.")+(!state.bom.length?`<div class="empty"><h3>Project is empty</h3><p>Add parts from Discover.</p><button class="action" data-view="discover">Find parts</button></div>`:`<div class="table-wrap"><table><thead><tr><th>Part</th><th>Qty</th><th>Intent</th><th>Note</th><th></th></tr></thead><tbody>${state.bom.map((l,i)=>{const p=PARTS.find(x=>x.id===l.id);return `<tr><td><b>${p?.name||l.id}</b><br><small>${l.id}</small></td><td><input type="number" min="0" value="${l.qty}" data-line="${i}" data-field="qty"></td><td><select data-line="${i}" data-field="intent">${["Required","Preferred","Optional","Substitute"].map(x=>`<option ${l.intent===x?"selected":""}>${x}</option>`).join("")}</select></td><td><input value="${esc(l.note||"")}" data-line="${i}" data-field="note"></td><td><button data-remove="${i}">Remove</button></td></tr>`}).join("")}</tbody></table><div class="export"><button id="bom-json">JSON baseline</button><button id="bom-csv">CSV</button><button onclick="print()">Print</button></div></div>`)}
function mine(){const ps=state.favorites.map(id=>PARTS.find(p=>p.id===id)).filter(Boolean);return head("Local overlay","My Parts","Favorites and notes stay on this device, separate from the common catalog.")+(!ps.length?`<div class="empty"><h3>No saved families</h3><p>Use Save on a catalog card.</p></div>`:`<div class="grid">${ps.map(card).join("")}</div>`)}
function updates(){return head("Catalog operations","Updates & Backup","Catalog packages move independently from the application and never silently rewrite project baselines.")+`<div class="curator"><article><h3>Active package</h3><p>2026.08.24-demo · Schema 3 · demonstration data</p><button id="check">Check for updates</button></article><article><h3>Full local backup</h3><p>Export projects, favorites, compare selections, review decisions, and preferences.</p><button id="backup">Download JSON</button></article><article><h3>Restore</h3><p>Validate a CHANDLER backup before replacing local state.</p><input id="restore" type="file" accept=".json"></article><article><h3>Fresh Start</h3><p>Clear local workspace data while retaining the bundled demonstration catalog.</p><button id="fresh">Clear local data</button></article></div>`}
function help(){return head("Methodology & trust","Help","CHANDLER is a starting-point library, not a substitute for engineering verification.")+`<div class="curator"><article><h3>Common is not recommended</h3><p>Observed Commonness measures project presence. Prototype Utility measures sourcing resilience, interchangeability, assembly effort, documentation, cost suitability, and reuse.</p></article><article><h3>Interfaces first</h3><p>Nominal size alone does not establish fit, mating geometry, rating, ecosystem, or electrical compatibility.</p></article><article><h3>Unknown means unknown</h3><p>Missing evidence stays explicit. The bundled scores are demonstrations; supplier stock and price remain Unknown.</p></article><article><h3>Private by default</h3><p>No telemetry, advertising, mandatory account, supplier credentials, or hidden network requests.</p></article></div>`}
function curator(v){if(v==="curator")return head("Catalog maintenance","Curator Overview","Collect → Extract → Normalize → Review → Publish → Update")+`<div class="curator"><article><h3>Raw observations</h3><p>${OBS.length} immutable demonstration lines</p></article><article><h3>Review queue</h3><p>${OBS.filter(x=>!state.decisions[x.id]).length} decisions pending</p></article><article><h3>Canonical catalog</h3><p>${PARTS.length} demonstration families</p></article><article><h3>Quality gates</h3><p>Identifiers, references, scores, migrations, and offline package checked</p></article></div>`;
 if(v==="imports")return head("Local ingestion","Manual Import","Preview pasted Bill of Materials rows before creating immutable observations.")+`<div class="curator"><article><label>Paste tabular text<textarea id="paste" rows="10">M3x8 SHCS\t24\teach\n608ZZ\t4\teach</textarea></label><button id="stage">Validate and stage</button></article><article id="stage-result"><h3>Preview</h3><p>No canonical record changes until a curator reviews staged candidates.</p></article></div>`;
 if(v==="review")return head("Delta review","Review Queue","Automation proposes; a human accepts, rejects, defers, or requests evidence.")+`<div class="curator"><article>${OBS.map(o=>`<div class="review"><small>${o.id} · ${o.confidence}% candidate confidence</small><strong>${o.raw} → ${o.candidate}</strong><div>${["Accept","Reject","Defer","Evidence"].map(d=>`<button data-decision="${o.id}" data-value="${d}">${state.decisions[o.id]===d?"✓ ":""}${d}</button>`).join("")}</div></div>`).join("")}</article><article><h3>Governance</h3><p>Class A and Class B mechanical substitution proposals require human approval, documented constraints, and evidence.</p></article></div>`;
 if(v==="rules")return head("Deterministic engine","Normalization","Rules are versioned, transparent, testable, and reversible.")+`<div class="curator"><article><label>Original source text<input id="rule-input" value="DIN 912 M3x8 SHCS"></label><button id="rule-run">Run rules</button></article><article><h3>Normalized preview</h3><p id="rule-output">No canonical record changed.</p></article></div>`;
 return head("Governance & publishing","Releases","Generate a validated package, manifest, checksum, diff, and rollback checkpoint.")+`<div class="curator"><article><h3>2026.08.24-demo</h3><p>Active · Schema 3 · bundled demonstration package</p><button id="manifest">Export manifest</button></article><article><h3>Audit events</h3><p>Catalog activated · schema validated · ${Object.keys(state.decisions).length} local review decisions</p></article></div>`}
function render(){document.getElementById("app").classList.toggle("light",state.theme==="light");document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("active",b.dataset.mode===state.mode));$("#mode-status").textContent=state.mode==="maker"?"Maker Mode":"Curator Mode";nav();let html=state.detail?passport(state.detail):state.mode==="curator"?curator(state.view):({discover,compare,bom,mine,updates,help}[state.view]||discover)();$("#main").innerHTML=html;bind()}
function bind(){document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>setView(b.dataset.view));document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{state.query=b.dataset.q;state.view="discover";save();render()});document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{state.detail=b.dataset.open;render()});const back=$("#back");if(back)back.onclick=()=>{delete state.detail;render()};document.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>{const id=b.dataset.fav;state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();render()});document.querySelectorAll("[data-compare]").forEach(b=>b.onclick=()=>{const id=b.dataset.compare;state.compare=state.compare.includes(id)?state.compare.filter(x=>x!==id):state.compare.length<4?[...state.compare,id]:state.compare;save();render()});document.querySelectorAll("[data-bom]").forEach(b=>b.onclick=()=>{const id=b.dataset.bom,l=state.bom.find(x=>x.id===id);if(l)l.qty++;else state.bom.push({id,qty:1,intent:"Required",note:""});save();toast("Added to Bench Supply")});const go=$("#go");if(go)go.onclick=()=>{state.query=$("#hero-q").value;save();render()};document.querySelectorAll("[data-line]").forEach(e=>e.onchange=()=>{state.bom[+e.dataset.line][e.dataset.field]=e.dataset.field==="qty"?Math.max(0,+e.value):e.value;save()});document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{state.bom.splice(+b.dataset.remove,1);save();render()});const bj=$("#bom-json");if(bj)bj.onclick=()=>download("chandler-bench-supply.json",JSON.stringify({schemaVersion:3,catalogVersion:"2026.08.24-demo",lines:state.bom.map(l=>({...l,snapshot:PARTS.find(p=>p.id===l.id)}))},null,2),"application/json");const bc=$("#bom-csv");if(bc)bc.onclick=()=>download("chandler-bench-supply.csv","Part ID,Name,Quantity,Intent,Note\n"+state.bom.map(l=>[l.id,PARTS.find(p=>p.id===l.id)?.name,l.qty,l.intent,l.note].map(x=>'"'+String(x||"").replaceAll('"','""')+'"').join(",")).join("\n"),"text/csv");const check=$("#check");if(check)check.onclick=()=>toast("No update address configured; import a catalog package");const backup=$("#backup");if(backup)backup.onclick=()=>download("chandler-backup.json",JSON.stringify({format:"CHANDLER_BACKUP",schemaVersion:3,workspace:state},null,2),"application/json");const restore=$("#restore");if(restore)restore.onchange=async()=>{try{const j=JSON.parse(await restore.files[0].text());if(j.format!=="CHANDLER_BACKUP"||j.schemaVersion>3)throw 0;state=Object.assign({},defaults,j.workspace);save();render();toast("Backup restored") }catch{toast("Restore blocked: invalid or future schema")}};const fresh=$("#fresh");if(fresh)fresh.onclick=()=>{if(confirm("Clear all local CHANDLER workspace data?")){state={...defaults,favorites:[],compare:[],bom:[],decisions:{}};save();render()}};const stage=$("#stage");if(stage)stage.onclick=()=>{const rows=$("#paste").value.split(/\n/).filter(Boolean);$("#stage-result").innerHTML=`<h3>${rows.length} rows staged</h3><p>Validation passed. Raw source text is preserved; no canonical record changed.</p>`};document.querySelectorAll("[data-decision]").forEach(b=>b.onclick=()=>{state.decisions[b.dataset.decision]=b.dataset.value;save();render()});const rr=$("#rule-run");if(rr)rr.onclick=()=>{$("#rule-output").textContent=$("#rule-input").value.replace(/DIN\s*912/ig,"ISO 4762 geometry reference").replace(/M3\s*[x×]\s*8/ig,"M3 × 8 millimeters").replace(/SHCS/ig,"socket-head cap screw")+" · No canonical record changed."};const mf=$("#manifest");if(mf)mf.onclick=()=>download("catalog-manifest.json",JSON.stringify({catalogVersion:"2026.08.24-demo",schemaVersion:3,partFamilyCount:PARTS.length,checksumAlgorithm:"SHA-256",checksum:"development-demonstration-package"},null,2),"application/json")}
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;state.view=state.mode==="maker"?"discover":"curator";delete state.detail;save();render()});$("#theme").onclick=()=>{state.theme=state.theme==="dark"?"light":"dark";save();render()};$("#global-search").onkeydown=e=>{if(e.key==="Enter"){state.query=e.target.value;state.mode="maker";state.view="discover";save();render()}};addEventListener("online",()=>$("#network").textContent="Online");addEventListener("offline",()=>$("#network").textContent="Offline");if("serviceWorker" in navigator)navigator.serviceWorker.register("service-worker.js").catch(()=>{});render();
</script>
