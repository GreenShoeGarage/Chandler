    var accepted = CH.applyMerge(base, d3, { "slots:S1": true });
    eq("an accepted change is applied", accepted.library.slots[0].name, "One renamed");
    var srcBase = { slots: [], orderables: [], sourcing: [{ orderable_id: "O1", distributor: "D", region: "NA", observed_on: TODAY, observer: "a" }] };
    eq("identical sourcing records deduplicate on their natural key",
      CH.diffPack(srcBase, srcBase).adds.length, 0);
    eq("a second observation on a different date is a new record",
      CH.diffPack(srcBase, { sourcing: [{ orderable_id: "O1", distributor: "D", region: "NA", observed_on: "2026-08-01", observer: "a" }] }).adds.length, 1);
    ok("a file that is not a pack is reported as invalid", CH.diffPack(base, null).invalid.length > 0);

    /* --- coverage --- */
    var covLib = { slots: [{ id: "S1", name: "Res", category_path: ["A"] }], orderables: [{ id: "O1", slot_id: "S1", mpn: "RC0603FR-0710KL" }, { id: "O2", slot_id: "S1", mpn: "ERJ-3EKF1002V" }], sourcing: [] };
    var cov = CH.coverageCheck([{ mpn: "rc0603fr 0710kl" }, { mpn: "NOT-IN-LIBRARY" }], covLib);
    eq("a match survives punctuation and case differences", cov.covered.length, 1);
    eq("an unmatched line is reported uncovered", cov.uncovered.length, 1);
    eq("coverage fraction is reported", Math.round(cov.fraction * 100), 50);
    eq("a covered line lists its library alternates", cov.covered[0].alternates.length, 1);

    /* --- tooling --- */
    var toolLib = {
      slots: [
        { id: "T1", name: "Wire to board", category_path: ["A"], required_tooling: [
          { name: "Crimp tool", note: "the expensive one", one_time: true },
          { name: "Flux", one_time: false }
        ] },
        { id: "T2", name: "Ferrules", category_path: ["A"], required_tooling: [{ name: "crimp tool", one_time: true }] },
        { id: "T3", name: "Nothing needed", category_path: ["A"] }
      ],
      orderables: [], sourcing: []
    };
    var tools = CH.toolingFor(["T1", "T2", "T3"], toolLib);
    eq("tooling is deduplicated across slots", tools.length, 2);
    eq("the tool wanted by the most slots comes first", tools[0].name, "Crimp tool");
    eq("a tool records which slots want it", tools[0].slots, ["Wire to board", "Ferrules"]);
    eq("a tool keeps the note from the first slot that declared it", tools[0].note, "the expensive one");
    eq("one time purchases sort ahead of consumables", tools[1].one_time, false);
    eq("a slot with no tooling contributes nothing", CH.toolingFor(["T3"], toolLib).length, 0);
    eq("an unknown slot is ignored rather than throwing", CH.toolingFor(["NOPE"], toolLib).length, 0);

    /* --- identifier kind --- */
    ok("an unknown identifier kind fails validation",
      CH.validateLibrary({ slots: [{ id: "S1", name: "s", category_path: ["A"] }], orderables: [{ id: "O1", slot_id: "S1", mpn: "X", identifier_kind: "vibes" }], sourcing: [] })
        .some(function (e) { return /identifier kind/.test(e); }));
    ok("a specification with no description fails validation",
      CH.validateLibrary({ slots: [{ id: "S1", name: "s", category_path: ["A"] }], orderables: [{ id: "O1", slot_id: "S1", mpn: "X", identifier_kind: "specification", description: "" }], sourcing: [] })
        .some(function (e) { return /shop for/.test(e); }));
    eq("a specification with a description validates",
      CH.validateLibrary({ slots: [{ id: "S1", name: "s", category_path: ["A"] }], orderables: [{ id: "O1", slot_id: "S1", mpn: "X", identifier_kind: "specification", description: "what to buy" }], sourcing: [] }).length, 0);
    var specPart = { id: "SP", slot_id: "S1", mpn: "spec", identifier_kind: "specification", description: "d", hand_workable: true, lifecycle: "active", compliance: { standard: "" }, role: "primary" };
    eq("a specification does not get the published standard shortcut on multiple sources",
      gate(CH.admissionScore(specPart, [], R, TODAY, {}), "multi_source").verdict, "unknown");

    /* --- coverage runs --- */
    var covLib2 = { slots: [{ id: "S1", name: "Res", category_path: ["A"] }], orderables: [{ id: "O1", slot_id: "S1", mpn: "IN-LIB" }], sourcing: [] };
    var run1 = CH.coverageRun([{ mpn: "IN-LIB" }, { mpn: "GAP-A" }, { mpn: "GAP-B" }], covLib2, { name: "board one", ran_on: "2026-08-01" });
    eq("a run counts what it read", run1.total, 3);
    eq("a run counts what the library covered", run1.covered, 1);
    eq("a run keeps the gaps", run1.uncovered_mpns.length, 2);
    eq("a run is named and dated", run1.name + " " + run1.ran_on, "board one 2026-08-01");
    eq("an unnamed run still gets a name", CH.coverageRun([], covLib2, {}).name, "unnamed BOM");
    var run2 = CH.coverageRun([{ mpn: "IN-LIB" }, { mpn: "GAP-A" }], covLib2, { name: "board two", ran_on: "2026-08-10" });
    var gaps = CH.recurringGaps([run1, run2]);
    eq("the gap seen in both BOMs comes first", gaps[0].mpn, "GAP-A");
    eq("a recurring gap counts its BOMs", gaps[0].count, 2);
    eq("a recurring gap names its BOMs", gaps[0].runs, ["board one", "board two"]);
    eq("a gap seen once is still listed", gaps[1].count, 1);
    eq("the same gap twice in one BOM counts once",
      CH.recurringGaps([CH.coverageRun([{ mpn: "GAP-A" }, { mpn: "gap a" }], covLib2, { name: "x" })])[0].count, 1);
    var trend = CH.coverageTrend([run1, run2]);
    eq("the trend counts every line ever measured", trend.lines, 5);
    eq("the trend reports overall coverage across runs", Math.round(trend.fraction * 100), 40);
    eq("the trend knows the most recent run", trend.latest.name, "board two");
    eq("the trend knows the best run", trend.best.name, "board two");
    eq("an empty trend reports nothing rather than zero percent", CH.coverageTrend([]).fraction, null);

    /* --- candidates --- */
    var candLib = { slots: [], orderables: [], sourcing: [], candidates: [{ id: "C1", mpn: "REJECT-1", reason: "reel only" }] };
    eq("a candidate validates when it carries a reason", CH.validateLibrary(candLib).length, 0);
    ok("a candidate with no reason fails validation",
      CH.validateLibrary({ slots: [], orderables: [], sourcing: [], candidates: [{ id: "C2", mpn: "X", reason: "" }] })
        .some(function (e) { return /reason for being rejected/.test(e); }));
    ok("a rejected candidate is findable by part number, ignoring punctuation", CH.candidateFor("reject 1", candLib) !== null);
    ok("an archived candidate stops matching", CH.candidateFor("REJECT-1", { candidates: [{ id: "C1", mpn: "REJECT-1", reason: "r", archived: true }] }) === null);
    eq("candidates travel in a pack",
      CH.diffPack({ slots: [], orderables: [], sourcing: [], candidates: [] }, candLib).adds.length, 1);

    /* --- seed library integrity --- */
    if (seedLibrary) {
      var errs = CH.validateLibrary(seedLibrary);
      ok("the shipped library passes validation", errs.length === 0, errs.slice(0, 3).join(" | "));
      eq("the shipped library carries no sourcing evidence at all", (seedLibrary.sourcing || []).length, 0);
      eq("the shipped library carries no decision records", (seedLibrary.decisions || []).length, 0);
      eq("the shipped library carries no candidate records", (seedLibrary.candidates || []).length, 0);
      var noDev = seedLibrary.orderables.filter(function (o) { return o.drop_in === "no" && !o.drop_in_deviation; });
      ok("every alternate that is not drop in states its deviation", noDev.length === 0);
      var slotIds = {};
      seedLibrary.slots.forEach(function (s) { slotIds[s.id] = 1; });
      ok("every orderable belongs to a slot that exists",
        seedLibrary.orderables.every(function (o) { return slotIds[o.slot_id]; }));
      ok("the library carries both domains",
        seedLibrary.slots.some(function (s) { return s.domain === "electronic"; }) &&
        seedLibrary.slots.some(function (s) { return s.domain === "mechanical"; }));
      ok("every slot declares a preferred family",
        seedLibrary.slots.every(function (s) { return String(s.preferred_family || "").trim().length > 0; }));
      eq("no slot ships provisional any more", seedLibrary.slots.filter(function (s) { return s.status === "provisional"; }).length, 0);
      ok("every slot has at least one orderable part", (function () {
        var have = {};
        seedLibrary.orderables.forEach(function (o) { have[o.slot_id] = 1; });
        return seedLibrary.slots.filter(function (s) { return !have[s.id] && s.category_path[0] !== "Cross domain"; }).length === 0;
      })());
      ok("every ladder entry carries a full identifier", seedLibrary.slots.every(function (s) {
        return (s.family_ladder || []).every(function (r) { return String(r.identifier || "").trim() && String(r.label || "").trim(); });
      }));
      ok("the house fastener declares its tooling", (function () {
        var s2 = CH.findSlot(seedLibrary, "M-SCREW-SHCS-M3");
        return s2 && s2.required_tooling.length >= 2;
      })());
      ok("every slot explains why that family",
        seedLibrary.slots.every(function (s) { return String(s.why_this_family || "").trim().length > 0; }));
      var health = CH.libraryHealth(seedLibrary, R, TODAY, false);
      ok("library health reports without throwing", typeof health.slots === "number" && health.slots > 0);
      ok("no shipped part is admitted without evidence", health.verdicts.admitted === 0 || health.evidence_records > 0);
      var libWithEvidence = CH.clone(seedLibrary);
      var target = libWithEvidence.orderables[0];
      ok("library health agrees with the scorecard on the same part", (function () {
        var one = CH.admissionScore(target, libWithEvidence.sourcing, R, TODAY, {
          categoryMedian: CH.categoryMedian(target, libWithEvidence, R, TODAY, false)
        });
        var h2 = CH.libraryHealth(libWithEvidence, R, TODAY, false);
        return h2.verdicts[one.verdict] > 0;
      })());
    }

  }

<script id="chandler-ui">/* CHANDLER user interface.

    { id: "basket", label: "Basket" },
    { id: "stock", label: "Stock plan" },

  }

  }

  /* ---------- state ---------- */
  function freshState() {

      lib: (function () { var l = CH.clone(seedLibrary); if (!Array.isArray(l.candidates)) l.candidates = []; return l; })(),
      rules: CH.clone(CH.DEFAULT_RULES),
      basket: [],
      builds: 25,
      coverage: [],
      observer: "",
      ui: { station: "library", slot: null, theme: "night", debug: false, includeSample: false, filters: {} },
      sampleLoaded: false,
      savedAt: ""

  }
  function save() {
    if (!storageOK) { setSaveState("Held in memory only. Export before you close the tab."); return; }

    return el("div", { class: "stat" }, [el("span", { class: "n", text: String(n) }), el("span", { class: "l", text: label })]);
  }
  function selectField(label, options, value, onchange) {
    var sel = el("select", { onchange: function (e) { onchange(e.target.value); } });
    options.forEach(function (o) {
      var opt = el("option", { value: o, text: o });
      if (o === value) opt.selected = true;
      sel.appendChild(opt);
    });
    return el("div", { class: "field" }, [el("label", { text: label }), sel]);
  }

  function slotMatches(s, f) {
    if (f.cat) {
      var full = s.category_path.join(" / ");
      if (full !== f.cat && (full + " / ").indexOf(f.cat + " / ") !== 0) return false;
    }
    if (f.domain && f.domain !== "any" && s.domain !== f.domain) return false;
    if (f.status && f.status !== "any" && (s.status || "active") !== f.status) return false;
    var os = activeOrderables(s.id);
    if (f.hand === "yes only" && os.length && !os.some(function (o) { return o.hand_workable; })) return false;
    if (f.verdict && f.verdict !== "any") {
      if (f.verdict === "no parts yet") { if (os.length) return false; }
      else {
        if (!os.length) return false;
        var best = bestVerdict(os);
        if (best !== f.verdict) return false;
      }
    }
    if (f.q) {
      var hay = [s.name, s.function_summary, s.preferred_family, s.category_path.join(" "), s.id].join(" ").toLowerCase();
      var hay2 = os.map(function (o) { return o.mpn + " " + o.manufacturer + " " + o.description; }).join(" ").toLowerCase();
      var terms = f.q.toLowerCase().split(/\s+/).filter(Boolean);
      for (var i = 0; i < terms.length; i++) if (hay.indexOf(terms[i]) === -1 && hay2.indexOf(terms[i]) === -1) return false;
    }
    return true;
  }
  function bestVerdict(orderables) {
    var rank = { admitted: 0, unverified: 1, excluded: 2 };
    var best = "excluded";
    orderables.forEach(function (o) {
      var v = verdictFor(o).verdict;
      if (rank[v] < rank[best]) best = v;
    });
    return best;
  }

  function renderSlotList() {
    var panel = $("slotlistpanel"); if (!panel) return;
    clear(panel);
    var f = state.ui.filters;
    var matches = activeSlots().filter(function (s) { return slotMatches(s, f); });
    panel.appendChild(el("h3", { text: matches.length + " of " + activeSlots().length + " slots" }));
    if (!matches.length) {
      panel.appendChild(el("div", { class: "empty", text: "No slot matches those filters. Widen the search, or add the slot the library is missing from the Packs station." }));
      return;
    }
    var groups = {};
    matches.forEach(function (s) {
      var key = s.category_path.slice(0, 2).join(" / ");
      (groups[key] || (groups[key] = [])).push(s);
    });
    Object.keys(groups).sort().forEach(function (key) {
      panel.appendChild(el("h3", { class: "eyebrow", text: key }));
      var ul = el("ul", { class: "slotlist" });
      groups[key].forEach(function (s) {
        var os = activeOrderables(s.id);
        var meta = os.length ? (os.length + " part" + (os.length === 1 ? "" : "s") + "  ::  " + s.preferred_family)
          : ("no part recorded yet  ::  " + s.preferred_family);
        var btn = el("button", { type: "button", onclick: function () { go("slot", { slot: s.id }); } }, [
          el("span", { class: "nm", text: s.name }),
          el("span", { class: "meta", text: meta })
        ]);
        var li = el("li", null, [btn]);
        if (os.length) {
          var v = bestVerdict(os);
          btn.appendChild(el("span", { class: "stamp " + v, text: v }));
        } else if (s.status === "provisional") {
          btn.appendChild(el("span", { class: "stamp unknown", text: "provisional" }));
        }
        ul.appendChild(li);
      });
      panel.appendChild(ul);
    });
  }

  /* ---------- SLOT ---------- */

        el("div", { class: "rowwrap" }, [

          el("span", { class: "tag", text: s.status || "active" }),
          el("span", { class: "tag", text: s.id })
        ])
      ]),

    var body = el("div", { class: "cardbody" });

    if (s.family_ladder && s.family_ladder.length) {

      lad.appendChild(el("p", { class: "hint", text: "One purchasable family, not six unrelated decisions. Hold to these sizes and the drawer stays small." }));
      var chips = el("div", { class: "rowwrap", id: "ladderchips" });
      s.family_ladder.forEach(function (r) {
        chips.appendChild(el("button", {

        }));
      });
      lad.appendChild(chips);

        onclick: function () {

          setSaveState(s.family_ladder.length + " sizes added to the basket");
        }
      }));
      body.appendChild(lad);
    }
    if (s.required_tooling && s.required_tooling.length) {
      var tw = el("div", { class: "notice warn", style: "margin-top:12px", id: "slottooling" });
      tw.appendChild(el("strong", { text: "What this family assumes you own. " }));
      tw.appendChild(el("span", { text: "These are not on the bill of materials and they are what people forget to order." }));
      var ul = el("ul", { style: "margin:6px 0 0; padding-left:18px" });
      s.required_tooling.forEach(function (t) {
        ul.appendChild(el("li", null, [
          el("span", { text: t.name }),
          el("span", { class: "tag", style: "margin-left:6px", text: t.one_time === false ? "consumable" : "one time" }),
          t.note ? el("div", { class: "hint", text: t.note }) : null
        ]));
      });
      tw.appendChild(ul);

    if (s.typical_applications && s.typical_applications.length) {

    }
    body.appendChild(editSlotForm(s));
    card.appendChild(body);
    root.appendChild(card);

    /* orderables */
    var os = activeOrderables(s.id);
    var panel = el("div", { class: "panel" });
    panel.appendChild(el("h2", { text: "Orderable parts" }));
    if (!os.length) {
      panel.appendChild(el("div", { class: "empty", text: "No orderable part is recorded for this slot yet. That is a real gap, not an oversight: the slot exists so the preferred family is settled, and the part number can be filled in when someone verifies one. Add it from the Packs station or record what you find at Evidence." }));
    } else {
      os.sort(function (a, b) { return (a.role === "primary" ? 0 : 1) - (b.role === "primary" ? 0 : 1); });
      os.forEach(function (o) { panel.appendChild(orderableBlock(s, o)); });
    }
    root.appendChild(panel);

    /* decisions */
    var dpanel = el("div", { class: "panel" });
    dpanel.appendChild(el("h2", { text: "Decisions recorded here" }));
    var mine = (state.lib.decisions || []).filter(function (d) { return d.slot_id === s.id && !d.archived; });
    if (!mine.length) dpanel.appendChild(el("div", { class: "empty", text: "Nothing recorded. When you choose a part for a project, write down why. Future you is the reader." }));
    else {
      mine.forEach(function (d) {
        dpanel.appendChild(el("div", { class: "notice", style: "margin-bottom:8px" }, [
          el("div", { class: "eyebrow", text: d.decided_on + "  ::  " + (d.context || "no project named") }),
          el("div", { text: d.chosen_mpn + (d.second_source ? "   second source: " + d.second_source : "") }),
          el("div", { class: "hint", text: d.rationale || "No rationale recorded." })
        ]));
      });
    }
    var ctx = el("input", { type: "text", placeholder: "Project or context" });
    var why = el("textarea", { placeholder: "Why this part, and what you would watch for" });
    var chosen = el("select");
    os.forEach(function (o) { chosen.appendChild(el("option", { value: o.id, text: o.mpn })); });
    var second = el("select");
    second.appendChild(el("option", { value: "", text: "no second source chosen" }));
    os.forEach(function (o) { second.appendChild(el("option", { value: o.id, text: o.mpn })); });
    if (os.length) {
      dpanel.appendChild(el("div", { class: "grid2", style: "margin-top:10px" }, [
        el("div", { class: "field" }, [el("label", { text: "Chosen part" }), chosen]),
        el("div", { class: "field" }, [el("label", { text: "Second source" }), second]),
        el("div", { class: "field" }, [el("label", { text: "Project or context" }), ctx])
      ]));
      dpanel.appendChild(el("div", { class: "field" }, [el("label", { text: "Rationale" }), why]));
      dpanel.appendChild(el("button", {
        class: "btn primary", type: "button", text: "Record decision", onclick: function () {
          var o = CH.findOrderable(state.lib, chosen.value);
          var s2 = second.value ? CH.findOrderable(state.lib, second.value) : null;
          if (!o) return;
          (state.lib.decisions || (state.lib.decisions = [])).push({
            id: "D-" + Date.now(), slot_id: s.id, orderable_id: o.id, chosen_mpn: o.mpn,
            second_source: s2 ? s2.mpn : "", rationale: why.value.trim(), context: ctx.value.trim(),
            decided_on: today(), _origin: "local"
          });
          save(); renderSlot();
        }
      }));
    }
    root.appendChild(dpanel);
  }

  /* ---------- in place editing ---------- */
  function fieldRow(label, node) { return el("div", { class: "field" }, [el("label", { text: label }), node]); }
  function textIn(value, placeholder) { return el("input", { type: "text", value: value || "", placeholder: placeholder || "" }); }
  function areaIn(value, placeholder) { var a = el("textarea", { placeholder: placeholder || "" }); a.value = value || ""; return a; }
  function selectIn(options, value) {
    var sel = el("select");
    options.forEach(function (o) {
      var opt = el("option", { value: o, text: o });
      if (o === value) opt.selected = true;
      sel.appendChild(opt);
    });
    return sel;
  }

  function editSlotForm(s) {
    var name = textIn(s.name);
    var cat = textIn(s.category_path.join(" / "), "Electronic / Passive / Resistor");
    var fam = textIn(s.preferred_family);
    var why = areaIn(s.why_this_family);
    var fn = areaIn(s.function_summary);
    var cover = areaIn(s.coverage_note, "what this slot deliberately does not cover");
    var scheme = areaIn(s.numbering_scheme, "how to build the number for other values");
    var apps = textIn((s.typical_applications || []).join(", "), "comma separated");
    var dom = selectIn(["electronic", "mechanical", "cross"], s.domain);
    var status = selectIn(["active", "provisional", "deprecated"], s.status || "active");
    return el("details", { class: "editform" }, [
      el("summary", { text: "Edit this slot" }),
      el("div", { class: "grid2" }, [
        fieldRow("Name", name), fieldRow("Domain", dom),
        fieldRow("Category path, slash separated", cat), fieldRow("Preferred family", fam),
        fieldRow("Status", status), fieldRow("Typical uses", apps)
      ]),
      fieldRow("What it does", fn),
      fieldRow("Why this family", why),
      fieldRow("What it does not cover", cover),
      fieldRow("How the part numbers are built", scheme),
      el("div", { class: "rowwrap" }, [
        el("button", { class: "btn primary", type: "button", text: "Save the slot", onclick: function () {
          if (!name.value.trim() || !fam.value.trim() || !why.value.trim()) {
            alert("A slot needs a name, a preferred family, and the reason for that family. The reason is the point of the library.");
            return;
          }
          s.name = name.value.trim();
          s.domain = dom.value;
          s.category_path = cat.value.split("/").map(function (x) { return x.trim(); }).filter(Boolean);
          if (!s.category_path.length) s.category_path = ["Uncategorised"];
          s.preferred_family = fam.value.trim();
          s.why_this_family = why.value.trim();
          s.function_summary = fn.value.trim();
          s.coverage_note = cover.value.trim();
          s.numbering_scheme = scheme.value.trim();
          s.typical_applications = apps.value.split(",").map(function (x) { return x.trim(); }).filter(Boolean);
          s.status = status.value;
          s._origin = "local";
          save(); renderSlot();
          setSaveState("Slot updated. It will ride out in your next proposal pack.");
        } }),
        el("button", { class: "btn", type: "button", text: "Archive this slot", onclick: function () {
          if (!confirm("Archive " + s.name + "? Its parts stay attached and nothing is deleted. You can restore it from the Packs station.")) return;
          s.archived = true; s._origin = "local"; save(); go("library");
        } })
      ])
    ]);
  }

  function editOrderableForm(o) {
    var mpn = textIn(o.mpn);
    var mfr = textIn(o.manufacturer);
    var desc = textIn(o.description);
    var pkg = textIn(o.package_or_size);
    var mat = textIn(o.finish_or_material);
    var role = selectIn(["primary", "alternate"], o.role);
    var life = selectIn(["active", "nrnd", "obsolete", "unknown"], o.lifecycle || "unknown");
    var drop = selectIn(["yes", "no"], o.drop_in || "yes");
    var dev = textIn(o.drop_in_deviation, "required when it is not a drop in: what actually differs");
    var hand = selectIn(["yes", "no"], o.hand_workable ? "yes" : "no");
    var handNote = textIn(o.hand_workable_note, "what it takes to place or drive it");
    var ds = textIn(o.datasheet_url, "a link you have actually opened");
    var std = textIn(o.compliance && o.compliance.standard, "ISO 4762, AS568");
    var fp = textIn(o.footprint_reference, "the footprint you use for it");
    var notes = areaIn(o.notes);
    return el("details", { class: "editform" }, [
      el("summary", { text: "Edit this part" }),
      el("div", { class: "grid2" }, [
        fieldRow("Part number", mpn), fieldRow("Manufacturer", mfr),
        fieldRow("Package or size", pkg), fieldRow("Finish or material", mat),
        fieldRow("Role", role), fieldRow("Lifecycle", life),
        fieldRow("Drop in for the primary", drop), fieldRow("Hand workable", hand),
        fieldRow("Standard, if any", std), fieldRow("Footprint reference", fp)
      ]),
      fieldRow("Description", desc),
      fieldRow("Deviation", dev),
      fieldRow("Hand working note", handNote),
      fieldRow("Datasheet link", ds),
      fieldRow("Notes", notes),
      el("button", { class: "btn primary", type: "button", text: "Save the part", onclick: function () {
        if (!mpn.value.trim()) { alert("A part needs a number."); return; }
        if (drop.value === "no" && !dev.value.trim()) {
          alert("A part marked as not a drop in must say what differs. That note is the whole reason the field exists.");
          return;
        }
        o.mpn = mpn.value.trim();
        o.manufacturer = mfr.value.trim();
        o.description = desc.value.trim();
        o.package_or_size = pkg.value.trim();
        o.finish_or_material = mat.value.trim();
        o.role = role.value;
        o.lifecycle = life.value;
        o.drop_in = drop.value;
        o.drop_in_deviation = drop.value === "no" ? dev.value.trim() : "";
        o.hand_workable = hand.value === "yes";
        o.hand_workable_note = handNote.value.trim();
        o.datasheet_url = ds.value.trim();
        o.footprint_reference = fp.value.trim();
        o.compliance = o.compliance || {};
        o.compliance.standard = std.value.trim();
        o.notes = notes.value.trim();
        o._origin = "local";
        save(); renderSlot();
        setSaveState("Part updated. It will ride out in your next proposal pack.");
      } })
    ]);
  }

  function orderableBlock(slot, o) {
    var res = verdictFor(o);
    var box = el("div", { class: "panel", style: "background:var(--panel-2); margin-top:10px" });
    box.appendChild(el("div", { class: "rowwrap" }, [
      el("strong", { class: "mono", text: o.mpn }),
      el("span", { class: "tag", text: o.manufacturer }),
      el("span", { class: "tag", text: o.role }),
      o.identifier_kind === "standard" ? el("span", { class: "tag family", text: "published standard" }) : null,
      o.identifier_kind === "specification" ? el("span", { class: "tag", text: "specification, not a part number" }) : null,
      o.package_or_size ? el("span", { class: "tag", text: o.package_or_size }) : null,
      stamp(res.verdict, res.verdict)
    ]));
    box.appendChild(el("p", { style: "margin-top:6px", text: o.description }));
    if (o.drop_in === "no") {
      box.appendChild(el("div", { class: "notice bad" }, [
        el("strong", { text: "Not a drop in replacement. " }), el("span", { text: o.drop_in_deviation })
      ]));
    }
    if (o.lifecycle && o.lifecycle !== "active") {
      box.appendChild(el("div", { class: "notice warn", style: "margin-top:6px", text: "Lifecycle: " + o.lifecycle + "." }));
    }
    if (o.notes) box.appendChild(el("p", { class: "hint", text: o.notes }));
    box.appendChild(gateRow(res));
    box.appendChild(el("div", { class: "hint", text: res.sentence }));

    var fresh = CH.freshSourcing(o.id, state.lib.sourcing || [], today(), state.rules, state.ui.includeSample);
    var all = (state.lib.sourcing || []).filter(function (x) { return x.orderable_id === o.id; });
    if (all.length) {
      box.appendChild(el("div", { class: "tablewrap", style: "margin-top:8px" }, [sourcingTable(all)]));
    } else {
      box.appendChild(el("div", { class: "hint", style: "margin-top:6px", text: "No sourcing observation recorded for this part." }));
    }
    box.appendChild(el("div", { class: "rowwrap", style: "margin-top:10px" }, [
      el("button", { class: "btn small", type: "button", text: "Add to basket", onclick: function () { addToBasket(slot, o); } }),
      el("button", { class: "btn small", type: "button", text: "Record an observation", onclick: function () { go("evidence"); prefillEvidence(o.id); } }),
      el("button", { class: "btn small", type: "button", text: "Copy a search string", onclick: function () { copyText(o.mpn + " " + o.manufacturer + " datasheet"); } }),
      el("button", { class: "btn small", type: "button", text: "Archive this part", onclick: function () { if (confirm("Archive " + o.mpn + "? It stays in the file and can be restored from Packs.")) { o.archived = true; o._origin = "local"; save(); renderSlot(); } } })
    ]));
    box.appendChild(editOrderableForm(o));
    if (fresh.length === 0 && all.length > 0) {
      box.appendChild(el("div", { class: "hint", text: "Every observation on this part is stale, so it counts for nothing in the scorecard until someone checks again." }));
    }
    return box;
  }

  function sourcingTable(records) {
    var t = el("table");
    var head = el("tr");
    ["Distributor", "SKU", "Region", "Observed", "Age", "Stock", "MOQ", "Pack", "Lead", "Price ladder", "Observer"].forEach(function (h) {
      head.appendChild(el("th", { text: h }));
    });
    t.appendChild(el("thead", null, [head]));
    var body = el("tbody");
    records.slice().sort(function (a, b) { return String(b.observed_on).localeCompare(String(a.observed_on)); }).forEach(function (s) {
      var age = CH.ageOf(s, today());
      var tr = el("tr");
      tr.appendChild(el("td", null, [el("span", { text: s.distributor || "not recorded" }), CH.isSample(s) ? el("span", { class: "stamp sample", style: "margin-left:6px", text: "sample" }) : null]));
      tr.appendChild(el("td", { class: "mono", text: s.distributor_sku || "" }));
      tr.appendChild(el("td", { text: s.region || "" }));
      tr.appendChild(el("td", { class: "mono", text: s.observed_on || "undated" }));
      tr.appendChild(el("td", { class: "num" }, [
        el("span", { text: age === null ? "n/a" : age + " d" }),
        CH.isStale(s, today(), state.rules) ? el("span", { class: "stamp unknown", style: "margin-left:6px", text: "stale" }) : null
      ]));
      tr.appendChild(el("td", { class: "num", text: numOr(s.stock_observed) }));
      tr.appendChild(el("td", { class: "num", text: numOr(s.moq) }));
      tr.appendChild(el("td", { class: "num", text: numOr(s.pack_qty) }));
      tr.appendChild(el("td", { text: s.lead_time_days_class || "unknown" }));
      tr.appendChild(el("td", { class: "mono", text: ladderText(s) }));
      tr.appendChild(el("td", { text: s.observer || "not recorded" }));
      body.appendChild(tr);
    });
    t.appendChild(body);
    return t;
  }
  function numOr(v) { return typeof v === "number" ? String(v) : "not recorded"; }
  function ladderText(s) {
    if (!s.price_breaks || !s.price_breaks.length) return "not recorded";
    return s.price_breaks.map(function (b) { return b.qty + " at " + b.price; }).join(", ") + (s.currency ? " " + s.currency : "");
  }
  function copyText(t) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(function () { setSaveState("Copied: " + t); }, function () { window.prompt("Copy this:", t); });
    } else window.prompt("Copy this:", t);
  }

  /* ---------- BASKET ---------- */
  /* A ladder rung is a real purchase even when it has no orderable record of its
     own, so the basket has to carry a line that is not tied to one. */
  function addLadderLine(slot, rung, quiet) {
    var known = activeOrderables(slot.id).filter(function (o) { return o.mpn === rung.identifier; })[0];
    if (known) { addToBasket(slot, known, quiet); return; }
    var existing = state.basket.filter(function (b) { return !b.orderable_id && b.mpn === rung.identifier; })[0];
    if (existing) existing.qtyPer += 1;
    else state.basket.push({
      orderable_id: "", slot_id: slot.id, mpn: rung.identifier,
      description: slot.name + ", " + rung.label, ref: "", qtyPer: 1, note: ""
    });
    if (!quiet) { save(); setSaveState(rung.label + " added to the basket"); }
  }

  function addToBasket(slot, o, quiet) {
    var existing = state.basket.filter(function (b) { return b.orderable_id === o.id; })[0];
    if (existing) existing.qtyPer += 1;
    else state.basket.push({
      orderable_id: o.id, slot_id: slot.id, mpn: o.mpn, description: o.description, ref: "", qtyPer: 1, note: ""
    });
    if (quiet) return;
    save();
    setSaveState(o.mpn + " added to the basket");
  }

  /* Resolves a basket line whether or not it points at an orderable record. */
  function basketPart(b) {
    var o = b.orderable_id ? CH.findOrderable(state.lib, b.orderable_id) : null;
    if (o) return { orderable: o, mpn: o.mpn, description: o.description, slot_id: o.slot_id };
    if (b.mpn) return { orderable: null, mpn: b.mpn, description: b.description || "", slot_id: b.slot_id };
    return null;
  }
  function renderBasket() {
    var root = $("st-basket"); clear(root);
    root.appendChild(el("div", { class: "panel" }, [
      el("h2", { text: "Basket" }),
      el("p", { text: "The working selection for one project. Quantity is per build. This is a staging area for export, not an inventory: what you have on the shelf is a different instrument's job." })
    ]));
    if (!state.basket.length) {
      root.appendChild(el("div", { class: "empty", text: "The basket is empty. Open a slot from the Library station and add a part." }));
      return;
    }
    var panel = el("div", { class: "panel" });
    var t = el("table");
    var head = el("tr");
    ["Ref", "Part number", "Description", "Slot", "Qty per build", ""].forEach(function (h) { head.appendChild(el("th", { text: h })); });
    t.appendChild(el("thead", null, [head]));
    var body = el("tbody");
    state.basket.forEach(function (b, i) {
      var part = basketPart(b);
      if (!part) return;
      var tr = el("tr");
      tr.appendChild(el("td", null, [el("input", {
        type: "text", value: b.ref, placeholder: "R1, U3", style: "min-width:90px",
        onchange: function (e) { b.ref = e.target.value; save(); }
      })]));
      tr.appendChild(el("td", { class: "mono" }, [
        el("span", { text: part.mpn }),
        part.orderable ? null : el("span", { class: "stamp unknown", style: "margin-left:6px", text: "not a library part" })
      ]));
      tr.appendChild(el("td", { text: part.description }));
      tr.appendChild(el("td", { text: slotName(b.slot_id) }));
      tr.appendChild(el("td", null, [el("input", {
        type: "number", min: "0", step: "1", value: String(b.qtyPer), style: "max-width:90px",
        onchange: function (e) { b.qtyPer = Math.max(0, parseInt(e.target.value, 10) || 0); save(); renderStock(); }
      })]));
      tr.appendChild(el("td", null, [el("button", {
        class: "btn small", type: "button", text: "Remove",
        onclick: function () { state.basket.splice(i, 1); save(); renderBasket(); renderStock(); }
      })]));
      body.appendChild(tr);
    });
    t.appendChild(body);
    panel.appendChild(el("div", { class: "tablewrap" }, [t]));
    panel.appendChild(el("div", { class: "rowwrap", style: "margin-top:12px" }, [
      el("button", { class: "btn primary", type: "button", text: "Export BOM CSV for TALLY", onclick: exportTallyCsv }),
      el("button", { class: "btn", type: "button", text: "Export TALLY job JSON", onclick: exportTallyJob }),
      el("button", { class: "btn", type: "button", text: "Export a markdown summary", onclick: exportBasketMarkdown }),
      el("button", { class: "btn", type: "button", text: "Empty the basket", onclick: function () { if (confirm("Empty the basket? The library is untouched.")) { state.basket = []; save(); renderBasket(); renderStock(); } } })
    ]));
    panel.appendChild(el("p", { class: "hint", style: "margin-top:10px", text: "TALLY imports from a file picker, so both exports are written to your downloads folder as well as being available to copy. In TALLY use Import CSV for the .csv and Load job for the .json." }));
    root.appendChild(panel);
  }
  function basketLines() {
    return state.basket.map(function (b, i) {
      var part = basketPart(b);
      if (!part) return null;
      var fresh = part.orderable
        ? CH.freshSourcing(part.orderable.id, state.lib.sourcing || [], today(), state.rules, state.ui.includeSample)
        : [];
      return {
        ref: b.ref || "REF" + (i + 1), mpn: part.mpn, description: part.description,
        qty: b.qtyPer, offers: CH.offersFromSourcing(fresh)
      };
    }).filter(Boolean);
  }
  function exportTallyCsv() { download("chandler-bom.csv", CH.toTallyCSV(basketLines()), "text/csv;charset=utf-8"); }
  function exportTallyJob() {
    var job = CH.toTallyJob(basketLines(), state.builds, { source: "CHANDLER " + VERSION, exported_on: today() });
    download("chandler-job.json", JSON.stringify(job, null, 2), "application/json");
  }
  function exportBasketMarkdown() {
    var lines = ["# CHANDLER basket", "", "Exported " + today() + " from CHANDLER " + VERSION + ".", ""];
    state.basket.forEach(function (b) {
      var part = basketPart(b);
      if (!part) return;
      lines.push("- **" + part.mpn + "** x" + b.qtyPer + " per build. " + part.description + " Slot: " + slotName(b.slot_id) + ".");
    });
    var mdTools = CH.toolingFor(state.basket.map(function (b) { return b.slot_id; }), state.lib);
    if (mdTools.length) {
      lines.push("", "## Tooling this build assumes", "");
      mdTools.forEach(function (t) {
        lines.push("- " + t.name + (t.one_time ? " (one time purchase)" : " (consumable)") + (t.note ? ". " + t.note : ""));
      });
    }
    lines.push("", "Prices and stock are not included. Sourcing figures in CHANDLER are dated observations, not current data.");
    download("chandler-basket.md", lines.join("\n"), "text/markdown;charset=utf-8");
  }

  /* ---------- STOCK PLAN ---------- */
  function renderStock() {
    var root = $("st-stock"); if (!root) return; clear(root);
    root.appendChild(el("div", { class: "panel" }, [
      el("h2", { text: "Stock plan" }),
      el("p", { text: "How much to buy to build N of something, with pack quantity and minimum order rounding applied. This is the contract manufacturer idea from the old Common Parts Library, scaled down to one shop: standardize on the library and you can keep the common parts on the shelf." }),
      el("div", { class: "field", style: "max-width:220px" }, [
        el("label", { text: "Builds" }),
        el("input", {
          type: "number", min: "0", step: "1", value: String(state.builds),
          onchange: function (e) { state.builds = Math.max(0, parseInt(e.target.value, 10) || 0); save(); renderStock(); }
        })
      ])
    ]));
    if (!state.basket.length) {
      root.appendChild(el("div", { class: "empty", text: "The basket is empty, so there is nothing to plan. Add parts from a slot first." }));
      return;
    }
    var items = state.basket.map(function (b) {
      var part = basketPart(b);
      if (!part) return null;
      var fresh = part.orderable
        ? CH.freshSourcing(part.orderable.id, state.lib.sourcing || [], today(), state.rules, state.ui.includeSample)
        : [];
      var best = fresh[0] || null;
      return {
        mpn: part.mpn, description: part.description, qtyPer: b.qtyPer,
        pack: best && typeof best.pack_qty === "number" ? best.pack_qty : 1,
        moq: best && typeof best.moq === "number" ? best.moq : 1,
        distributor: best ? best.distributor : "",
        evidence: !!best
      };
    }).filter(Boolean);
    var plan = CH.stockPlan(items, state.builds);
    var panel = el("div", { class: "panel" });

    var groups = {}, order = [];
    plan.forEach(function (p, i) {
      var key = p.distributor || "No distributor recorded";
      if (!groups[key]) { groups[key] = []; order.push(key); }
      groups[key].push({ p: p, evidence: items[i].evidence });
    });
    order.sort(function (a, b) {
      var an = a === "No distributor recorded", bn = b === "No distributor recorded";
      if (an !== bn) return an ? 1 : -1;
      return a.localeCompare(b);
    });
    order.forEach(function (key) {
      var rows = groups[key];
      var lines = rows.length;
      var units = rows.reduce(function (n, r) { return n + r.p.order_qty; }, 0);
      panel.appendChild(el("div", { class: "groupbar" }, [
        el("h3", { style: "margin:0", text: key }),
        el("span", { class: "hint", text: lines + " line" + (lines === 1 ? "" : "s") + ", " + units + " pieces" })
      ]));
      var t = el("table");
      var head = el("tr");
      ["Part number", "Needed", "Pack", "MOQ", "Order", "Overage"].forEach(function (h) { head.appendChild(el("th", { text: h })); });
      t.appendChild(el("thead", null, [head]));
      var body = el("tbody");
      rows.forEach(function (r) {
        var tr = el("tr");
        tr.appendChild(el("td", { class: "mono" }, [
          el("span", { text: r.p.mpn }),
          r.evidence ? null : el("span", { class: "stamp unknown", style: "margin-left:6px", text: "no evidence" })
        ]));
        tr.appendChild(el("td", { class: "num", text: String(r.p.needed) }));
        tr.appendChild(el("td", { class: "num", text: String(r.p.pack) }));
        tr.appendChild(el("td", { class: "num", text: String(r.p.moq) }));
        tr.appendChild(el("td", { class: "num", text: String(r.p.order_qty) }));
        tr.appendChild(el("td", { class: "num", text: String(r.p.overage) }));
        body.appendChild(tr);
      });
      t.appendChild(body);
      panel.appendChild(el("div", { class: "tablewrap" }, [t]));
    });
    panel.appendChild(el("p", { class: "hint", style: "margin-top:10px", text: "Grouped by the distributor on the most recent current observation, so each block is one order. Parts with no observation fall into the last group and have to be sourced before this plan is real." }));
    panel.appendChild(el("div", { class: "notice warn", style: "margin-top:10px", text: "Pack quantity and minimum order default to one wherever no observation has been recorded, which will understate what you actually have to buy. Record the real figures at the Evidence station before trusting this plan." }));
    panel.appendChild(el("div", { class: "rowwrap", style: "margin-top:10px" }, [
      el("button", {
        class: "btn primary", type: "button", text: "Export the plan as CSV", onclick: function () {
          var rows = [["mpn", "description", "needed", "pack", "moq", "order_qty", "overage", "distributor"]];
          plan.forEach(function (p) { rows.push([p.mpn, p.description, p.needed, p.pack, p.moq, p.order_qty, p.overage, p.distributor]); });
          download("chandler-stock-plan.csv", CH.toCSV(rows), "text/csv;charset=utf-8");
        }
      })
    ]));
    root.appendChild(panel);
    root.appendChild(toolingPanel());
  }

  function toolingPanel() {
    var tools = CH.toolingFor(state.basket.map(function (b) { return b.slot_id; }), state.lib);
    var tp = el("div", { class: "panel", id: "toolingpanel" });
    tp.appendChild(el("h3", { text: "Tooling this build assumes" }));
    if (!tools.length) {
      tp.appendChild(el("div", { class: "empty", text: "Nothing in the basket declares required tooling. That is either true or a gap in the library." }));
      return tp;
    }
    tp.appendChild(el("p", { class: "hint", text: "None of these are on the bill of materials and every one of them can stop a build dead. The one time purchases are bought once and then never again, which is exactly why they get forgotten." }));
    var tt = el("table", { id: "tooltable" });
    var th = el("tr");
    ["Tool or consumable", "Buy", "Wanted by", "Why"].forEach(function (h) { th.appendChild(el("th", { text: h })); });
    tt.appendChild(el("thead", null, [th]));
    var tb = el("tbody");
    tools.forEach(function (t) {
      var tr = el("tr");
      tr.appendChild(el("td", { text: t.name }));
      tr.appendChild(el("td", null, [el("span", { class: "stamp " + (t.one_time ? "pass" : "unknown"), text: t.one_time ? "one time" : "consumable" })]));
      tr.appendChild(el("td", { class: "hint", text: t.slots.join(", ") }));
      tr.appendChild(el("td", { class: "hint", text: t.note }));
      tb.appendChild(tr);
    });
    tt.appendChild(tb);
    tp.appendChild(el("div", { class: "tablewrap" }, [tt]));
    tp.appendChild(el("button", { class: "btn small", style: "margin-top:10px", type: "button", text: "Export the tooling list", onclick: function () {
      var rows = [["tool", "buy", "wanted_by", "note"]];
      tools.forEach(function (t) { rows.push([t.name, t.one_time ? "one time" : "consumable", t.slots.join("; "), t.note]); });
      download("chandler-tooling.csv", CH.toCSV(rows), "text/csv;charset=utf-8");
    } }));
    return tp;
  }

  /* ---------- ADMISSION ---------- */
  function renderAdmission() {
    var root = $("st-admission"); clear(root);
    root.appendChild(el("div", { class: "panel" }, [
      el("h2", { text: "The admission test" }),
      el("p", { text: "The library is useful because of what it keeps out. These are the gates, and they are yours to tune. A gate can pass, fail, or be unknown. Unknown means nobody has looked yet, which is a different thing from failing, and the scorecard keeps them apart." })
    ]));

    var rules = el("div", { class: "panel" });
    rules.appendChild(el("h3", { text: "Rule set" }));
    var grid = el("div", { class: "grid2" });
    ruleNum(grid, "stalenessDays", "Evidence goes stale after (days)");
    ruleNum(grid, "minDistributors", "Distributors required");
    ruleNum(grid, "maxMoqForOnes", "Highest acceptable minimum order");
    ruleNum(grid, "volumeQty", "Volume quantity to test against");
    ruleNum(grid, "priceSanityMultiple", "Price ceiling as a multiple of the category median");
    ruleNum(grid, "minRegions", "Regions required");
    rules.appendChild(grid);
    rules.appendChild(el("div", { class: "rowwrap" }, [
      el("button", { class: "btn small", type: "button", text: "Restore the defaults", onclick: function () { state.rules = CH.clone(CH.DEFAULT_RULES); save(); render(); } }),
      el("button", {
        class: "btn small", type: "button", "aria-pressed": String(!!state.ui.includeSample),
        text: "Count sample evidence: " + (state.ui.includeSample ? "on" : "off"),
        onclick: function () { state.ui.includeSample = !state.ui.includeSample; save(); render(); }
      })
    ]));
    root.appendChild(rules);

    var health = CH.libraryHealth(state.lib, state.rules, today(), state.ui.includeSample);
    root.appendChild(el("div", { class: "panel" }, [
      el("h3", { text: "Library health" }),
      el("div", { class: "grid2" }, [
        statBox(health.verdicts.admitted, "Admitted"),
        statBox(health.verdicts.unverified, "Unverified"),
        statBox(health.verdicts.excluded, "Excluded"),
        statBox(health.stale_records, "Stale observations")
      ]),
      el("p", { class: "hint", style: "margin-top:10px", text: "The old Common Parts Library aimed at covering roughly eighty percent of a design. That is a design goal for this library too, and it is not a claim worth making until it has been measured against real BOMs. Use the BOM coverage check on the Library station to measure it." })
    ]));

    root.appendChild(candidatePanel());

    var waiting = el("div", { class: "panel" });
    waiting.appendChild(el("h3", { text: "Waiting room" }));
    var excluded = activeOrderables().map(function (o) { return { o: o, res: verdictFor(o) }; })
      .filter(function (x) { return x.res.verdict === "excluded"; });
    if (!excluded.length) waiting.appendChild(el("div", { class: "empty", text: "Nothing is excluded on the current rule set and the current evidence." }));
    excluded.forEach(function (x) {
      var box = el("div", { class: "panel", style: "background:var(--panel-2); margin-top:8px" });
      box.appendChild(el("div", { class: "rowwrap" }, [
        el("strong", { class: "mono", text: x.o.mpn }),
        el("span", { class: "tag", text: slotName(x.o.slot_id) }),
        stamp("excluded", "excluded")
      ]));
      x.res.gates.filter(function (g) { return g.verdict === "fail"; }).forEach(function (g) {
        box.appendChild(el("div", { class: "hint", text: g.label + ": " + g.detail }));
      });
      box.appendChild(el("button", { class: "btn small", style: "margin-top:8px", type: "button", text: "Open the slot", onclick: function () { go("slot", { slot: x.o.slot_id }); } }));
      waiting.appendChild(box);
    });
    root.appendChild(waiting);
  }
  /* Parts looked at and turned down. Without this, the same part gets
     evaluated again in eight months by the same person. */
  function candidatePanel() {
    var panel = el("div", { class: "panel" });
    panel.appendChild(el("h3", { text: "Considered and rejected" }));
    panel.appendChild(el("p", { class: "hint", text: "A part that never entered the library, with the reason it did not. This is the memory that stops you evaluating the same reel only part twice a year." }));
    var live = (state.lib.candidates || []).filter(function (c) { return !c.archived; });
    if (!live.length) {
      panel.appendChild(el("div", { class: "empty", text: "Nothing recorded. When you look at a part and decide against it, write down why while you still remember." }));
    } else {
      var t = el("table", { id: "candidatetable" });
      var head = el("tr");
      ["Part number", "Considered", "Why not", "By", ""].forEach(function (h) { head.appendChild(el("th", { text: h })); });
      t.appendChild(el("thead", null, [head]));
      var body = el("tbody");
      live.slice().sort(function (a, b) { return String(b.considered_on).localeCompare(String(a.considered_on)); }).forEach(function (c) {
        var tr = el("tr");
        tr.appendChild(el("td", { class: "mono", text: c.mpn }));
        tr.appendChild(el("td", { class: "mono", text: c.considered_on || "undated" }));
        tr.appendChild(el("td", { text: c.reason }));
        tr.appendChild(el("td", { text: c.observer || "not recorded" }));
        tr.appendChild(el("td", null, [el("button", {
          class: "btn small", type: "button", text: "Reconsider", onclick: function () {
            if (!confirm("Put " + c.mpn + " back on the table? The record is archived rather than deleted, so the old reasoning survives.")) return;
            c.archived = true; c._origin = "local"; save(); render();
          }
        })]));
        body.appendChild(tr);
      });
      t.appendChild(body);
      panel.appendChild(el("div", { class: "tablewrap" }, [t]));
    }
    var mpn = el("input", { type: "text", placeholder: "the part you turned down" });
    var why = el("input", { type: "text", placeholder: "reel only, single source, obsolete next year, too fine to place" });
    panel.appendChild(el("div", { class: "grid2", style: "margin-top:10px" }, [
      fieldRow("Part number", mpn), fieldRow("Why not", why)
    ]));
    panel.appendChild(el("button", {
      class: "btn primary", type: "button", text: "Record the rejection", onclick: function () {
        if (!mpn.value.trim()) { alert("Name the part you turned down."); return; }
        if (!why.value.trim()) { alert("A rejection with no reason is worse than no record, because the next person has to work it out again."); return; }
        (state.lib.candidates || (state.lib.candidates = [])).push({
          id: "C-" + Date.now().toString(36).toUpperCase(),
          mpn: mpn.value.trim(), manufacturer: "", slot_id: "",
          reason: why.value.trim(), considered_on: today(),
          observer: state.observer || "", _origin: "local"
        });
        save(); render();
      }
    }));
    return panel;
  }

  function ruleNum(parent, key, label) {
    parent.appendChild(el("div", { class: "field" }, [
      el("label", { text: label }),
      el("input", {
        type: "number", min: "0", step: "1", value: String(state.rules[key]),
        onchange: function (e) {
          var v = parseFloat(e.target.value);
          state.rules[key] = isFinite(v) && v >= 0 ? v : CH.DEFAULT_RULES[key];
          save(); render();
        }
      })
    ]));
  }

  /* ---------- EVIDENCE ---------- */
  var evidencePrefill = null;
  function prefillEvidence(orderableId) { evidencePrefill = orderableId; renderEvidence(); }

  function queueReasonText(reason) {
    if (reason === "none") return "no evidence at all";
    if (reason === "overdue") return "every observation has gone stale";
    if (reason === "thin") return "below the distributor bar";
    return "goes stale soon";
  }

  function renderEvidence() {
    var root = $("st-evidence"); clear(root);
    root.appendChild(el("div", { class: "panel" }, [
      el("h2", { text: "Evidence" }),
      el("p", { text: "Every price, stock figure and lead time in this library is something a person saw on a page on a day. Nothing here is fetched. Record what you actually saw, sign it, and the scorecard will use it until it goes stale." })
    ]));

    var queue = CH.verificationQueue(state.lib, state.rules, today(), state.ui.includeSample);
    state.ui.sheet = (state.ui.sheet || []).filter(function (id) { return CH.findOrderable(state.lib, id); });

    /* ---- queue ---- */
    var qp = el("div", { class: "panel" });
    qp.appendChild(el("h3", { text: "What needs looking at" }));
    var byReason = { none: 0, overdue: 0, thin: 0, due: 0 };
    queue.forEach(function (q) { byReason[q.reason]++; });
    qp.appendChild(el("div", { class: "grid2" }, [
      statBox(byReason.none, "No evidence at all"),
      statBox(byReason.overdue, "Gone stale"),
      statBox(byReason.thin, "Below the bar"),
      statBox(byReason.due, "Stale within 30 days")
    ]));
    if (!queue.length) {
      qp.appendChild(el("div", { class: "empty", text: "Every part meets the distributor bar on current evidence. That is the whole point, and it will not last: come back when something goes stale." }));
    } else {
      qp.appendChild(el("div", { class: "rowwrap", style: "margin-top:10px" }, [
        el("button", { class: "btn small", type: "button", text: "Put the worst 25 on the sheet", onclick: function () {
          var add = queue.filter(function (q) { return !state.ui.queueFilter || q.reason === state.ui.queueFilter; })
            .slice(0, 25).map(function (q) { return q.orderable_id; });
          state.ui.sheet = uniqIds((state.ui.sheet || []).concat(add));
          save(); renderEvidence();
        } }),
        el("button", { class: "btn small", type: "button", text: "Download a worksheet", onclick: function () {
          var subset = queue.filter(function (q) { return !state.ui.queueFilter || q.reason === state.ui.queueFilter; });
          download("chandler-worksheet.csv", CH.worksheetCsv(subset, state.lib, state.rules, {
            observer: state.observer, region: "", observed_on: today(), currency: "USD"
          }), "text/csv;charset=utf-8");
        } }),
        el("button", { class: "btn small primary", type: "button", text: "Load a filled worksheet", onclick: loadWorksheet })
      ]));
      qp.appendChild(el("p", { class: "hint", style: "margin-top:8px", text: "The worksheet is a CSV with one row per distributor still wanted. Fill it in wherever you are, on a phone or in a spreadsheet, and load it back here. Rows you did not get to are ignored rather than treated as errors." }));

      /* Parts with no evidence at all outnumber everything else, so let the queue be narrowed. */
      var filters = [
        { id: "", label: "Everything", n: queue.length },

        { id: "overdue", label: "Gone stale", n: byReason.overdue },

      ];

      filters.forEach(function (f) {

        }));
      });
      qp.appendChild(bar);
      var shown = queue.filter(function (q) { return !state.ui.queueFilter || q.reason === state.ui.queueFilter; });

      var t = el("table", { id: "queuetable" });
      var head = el("tr");
      ["On sheet", "Part number", "Slot", "Why", "Current", "Stale in"].forEach(function (h) { head.appendChild(el("th", { text: h })); });
      t.appendChild(el("thead", null, [head]));
      var body = el("tbody");
      shown.slice(0, 60).forEach(function (q) {
        var tr = el("tr");
        var cb = el("input", { type: "checkbox", "aria-label": "Put " + q.mpn + " on the batch sheet" });
        cb.checked = (state.ui.sheet || []).indexOf(q.orderable_id) !== -1;
        cb.addEventListener("change", function () {
          if (cb.checked) state.ui.sheet = uniqIds((state.ui.sheet || []).concat([q.orderable_id]));
          else state.ui.sheet = (state.ui.sheet || []).filter(function (x) { return x !== q.orderable_id; });

        tr.appendChild(el("td", { class: "num", text: String(q.current) }));
        tr.appendChild(el("td", { class: "num", text: q.days_until_stale === null ? "n/a" : q.days_until_stale + " d" }));
        body.appendChild(tr);
      });

      else if (shown.length > 60) qp.appendChild(el("p", { class: "hint", text: "Showing the worst 60 of " + shown.length + ". The worksheet covers all of them." }));
    }
    root.appendChild(qp);

    /* ---- batch sheet ---- */
    root.appendChild(batchSheet());

    /* ---- single entry ---- */
    root.appendChild(singleEntryForm());

    /* ---- everything on file ---- */
    var list = el("div", { class: "panel" });
    list.appendChild(el("h3", { text: "Every observation, oldest first" }));
    var recs = (state.lib.sourcing || []).slice().sort(function (a, b) { return String(a.observed_on).localeCompare(String(b.observed_on)); });
    if (!recs.length) list.appendChild(el("div", { class: "empty", text: "Nothing recorded yet. The library ships with no sourcing evidence on purpose: a price nobody checked is worse than no price." }));
    else {
      var t2 = el("table", { id: "obstable" });
      var head2 = el("tr");
      ["Part", "Distributor", "Observed", "Age", "Ladder", "Observer", ""].forEach(function (h) { head2.appendChild(el("th", { text: h })); });
      t2.appendChild(el("thead", null, [head2]));
      var body2 = el("tbody");
      recs.forEach(function (rec2) {
        var o = CH.findOrderable(state.lib, rec2.orderable_id);

        tr.appendChild(el("td", { class: "mono", text: o ? o.mpn : rec2.orderable_id }));
        tr.appendChild(el("td", null, [el("span", { text: rec2.distributor || "not recorded" }), CH.isSample(rec2) ? el("span", { class: "stamp sample", style: "margin-left:6px", text: "sample" }) : null]));
        tr.appendChild(el("td", { class: "mono", text: rec2.observed_on || "undated" }));
        tr.appendChild(el("td", { class: "num" }, [
          el("span", { text: (CH.ageOf(rec2, today()) === null ? "n/a" : CH.ageOf(rec2, today()) + " d") }),
          CH.isStale(rec2, today(), state.rules) ? el("span", { class: "stamp unknown", style: "margin-left:6px", text: "stale" }) : null
        ]));

        tr.appendChild(el("td", { text: rec2.observer || "not recorded" }));
        tr.appendChild(el("td", null, [el("button", {
          class: "btn small", type: "button", text: "Remove", onclick: function () {
            if (!confirm("Remove this observation? Observations are the record, so only do this if it was entered in error.")) return;
            state.lib.sourcing.splice(state.lib.sourcing.indexOf(rec2), 1); save(); renderEvidence();
          }
        })]));
        body2.appendChild(tr);
      });
      t2.appendChild(body2);
      list.appendChild(el("div", { class: "tablewrap" }, [t2]));
    }
    list.appendChild(el("div", { class: "rowwrap", style: "margin-top:10px" }, [
      el("button", { class: "btn", type: "button", text: "Export observations as CSV", onclick: exportEvidenceCsv })
    ]));
    root.appendChild(list);
  }

  function uniqIds(list) {
    var seen = {}, out = [];
    list.forEach(function (x) { if (x && !seen[x]) { seen[x] = 1; out.push(x); } });
    return out;
  }

  /* One distributor, one visit, many parts. This is how evidence actually gets collected. */
  function batchSheet() {

      var ds = el("input", { type: "checkbox", "aria-label": "Datasheet available on the page for " + o.mpn });
      rows.push({ o: o, sku: sku, stock: stock, moq: moq, pack: pack, lead: lead, ladder: ladder, ds: ds });
      var tr = el("tr");
      tr.appendChild(el("td", { class: "mono" }, [
        el("span", { text: o.mpn }),

      ]));
      tr.appendChild(el("td", null, [sku]));
      tr.appendChild(el("td", null, [stock]));
      tr.appendChild(el("td", null, [moq]));
      tr.appendChild(el("td", null, [pack]));
      tr.appendChild(el("td", null, [lead]));
      tr.appendChild(el("td", null, [ladder]));
      tr.appendChild(el("td", null, [ds]));
      tr.appendChild(el("td", null, [el("button", {
        class: "btn small", type: "button", text: "Drop", onclick: function () {
          state.ui.sheet = ids.filter(function (x) { return x !== id; });

        }
      })]));
      body.appendChild(tr);
    });
    t.appendChild(body);
    panel.appendChild(el("div", { class: "tablewrap" }, [t]));
    panel.appendChild(el("div", { class: "rowwrap", style: "margin-top:10px" }, [
      el("button", { class: "btn primary", type: "button", text: "Record every filled row", onclick: function () {
        if (!dist.value.trim()) { alert("Name the distributor these observations came from."); return; }
        if (!who.value.trim()) { alert("Sign the sheet. An unsigned number is not evidence."); return; }
        if (!CH.parseDate(date.value)) { alert("Give a valid observation date in YYYY-MM-DD form."); return; }
        var recs = [];
        rows.forEach(function (r) {
          var ladder = CH.parseLadder(r.ladder.value);
          var anything = r.sku.value.trim() || r.stock.value || r.moq.value || r.pack.value || ladder.length || r.ds.checked;
          if (!anything) return;
          recs.push({
            orderable_id: r.o.id, distributor: dist.value.trim(), distributor_sku: r.sku.value.trim(),
            region: region.value, observed_on: date.value,
            stock_observed: numOrUndef(r.stock.value), moq: numOrUndef(r.moq.value), pack_qty: numOrUndef(r.pack.value),
            price_breaks: ladder, currency: cur.value.trim(), lead_time_days_class: r.lead.value,
            datasheet_seen: !!r.ds.checked, source_note: "", observer: who.value.trim(), _origin: "local"
          });
        });
        if (!recs.length) { alert("Every row is blank, so there is nothing to record."); return; }
        state.observer = who.value.trim();
        var out = CH.mergeSourcing(state.lib, recs);
        state.ui.sheet = [];
        save(); renderEvidence();
        setSaveState(out.added + " recorded, " + out.replaced + " replaced, from " + dist.value.trim());
      } }),
      el("button", { class: "btn", type: "button", text: "Clear the sheet", onclick: function () { state.ui.sheet = []; save(); renderEvidence(); } })
    ]));

  function singleEntryForm() {

    });

    var dist = el("input", { type: "text", placeholder: "Mouser, DigiKey, McMaster, a fastener house" });

    var region = selectIn(["NA", "EU", "UK", "APAC", "other"], "NA");
    var obs = el("input", { type: "date", value: today() });
    var stock = el("input", { type: "number", min: "0", step: "1", placeholder: "leave blank if you did not look" });
    var moq = el("input", { type: "number", min: "0", step: "1", placeholder: "leave blank if you did not look" });
    var pack = el("input", { type: "number", min: "0", step: "1", placeholder: "leave blank if you did not look" });
    var lead = selectIn(["stock", "short", "long", "unknown"], "stock");
    var breaks = el("input", { type: "text", placeholder: "1:0.12; 10:0.09; 100:0.06" });

      fieldRow("Observed on", obs), fieldRow("Stock seen", stock), fieldRow("Minimum order", moq),
      fieldRow("Pack quantity", pack), fieldRow("Lead time class", lead), fieldRow("Currency", cur),
      fieldRow("Observer", who)
    ]));
    form.appendChild(fieldRow("Price ladder, as quantity:price pairs", breaks));
    form.appendChild(fieldRow("Datasheet link", dsUrl));
    form.appendChild(fieldRow("Note", note));
    form.appendChild(el("div", { class: "field" }, [
      el("label", { for: "dsseen", text: "Documentation" }),
      el("div", { class: "rowwrap" }, [dsSeen, el("span", { class: "hint", text: "A datasheet or a published standard was available on that page." })])
    ]));
    form.appendChild(el("button", {
      class: "btn primary", type: "button", text: "Record it", onclick: function () {
        if (!sel.value) { alert("Choose the part this observation is about."); return; }
        if (!who.value.trim()) { alert("Sign the observation. An unsigned number is not evidence."); return; }
        if (!CH.parseDate(obs.value)) { alert("Give a valid observation date in YYYY-MM-DD form."); return; }
        var rec = {
          orderable_id: sel.value, distributor: dist.value.trim(), distributor_sku: sku.value.trim(),
          region: region.value, observed_on: obs.value,
          stock_observed: numOrUndef(stock.value), moq: numOrUndef(moq.value), pack_qty: numOrUndef(pack.value),
          price_breaks: CH.parseLadder(breaks.value), currency: cur.value.trim(),
          lead_time_days_class: lead.value, source_note: note.value.trim(),
          datasheet_seen: !!dsSeen.checked || !!dsUrl.value.trim(),
          observer: who.value.trim(), _origin: "local"
        };
        state.observer = who.value.trim();
        if (dsUrl.value.trim()) {
          var part = CH.findOrderable(state.lib, sel.value);
          if (part) { part.datasheet_url = dsUrl.value.trim(); part._origin = "local"; }
        }
        CH.mergeSourcing(state.lib, [rec]);
        evidencePrefill = null;
        save(); renderEvidence();
        setSaveState("Observation recorded");
      }
    }));
    return form;
  }

  function loadWorksheet() {
    pickFile(".csv,text/csv", function (text) {
      var out = CH.parseEvidenceCsv(text, state.lib, { observer: state.observer, observed_on: today() });
      if (!out.records.length && !out.skipped.length) {
        alert("Nothing in that file was filled in, so there is nothing to record.");
        return;
      }
      var msg = out.records.length + " observation" + (out.records.length === 1 ? "" : "s") + " to record.";
      if (out.blank) msg += "\n" + out.blank + " row" + (out.blank === 1 ? " was" : "s were") + " left blank and will be ignored.";
      if (out.skipped.length) msg += "\n\n" + out.skipped.length + " row" + (out.skipped.length === 1 ? "" : "s") + " could not be used:\n" + out.skipped.slice(0, 8).map(function (x) { return "  " + x.reason; }).join("\n");
      if (!out.records.length) { alert(msg); return; }
      if (!confirm(msg + "\n\nGo ahead?")) return;
      var res = CH.mergeSourcing(state.lib, out.records);
      out.datasheets.forEach(function (d) {
        var part = CH.findOrderable(state.lib, d.orderable_id);
        if (part && !part.datasheet_url) { part.datasheet_url = d.url; part._origin = "local"; }
      });
      save(); renderEvidence();
      setSaveState(res.added + " recorded, " + res.replaced + " replaced, " + out.datasheets.length + " datasheet link" + (out.datasheets.length === 1 ? "" : "s") + " captured");
    });
  }

  function exportEvidenceCsv() {
    var rows = [CH.WORKSHEET_HEADER.slice().concat(["sample"])];
    (state.lib.sourcing || []).forEach(function (s) {
      var o = CH.findOrderable(state.lib, s.orderable_id);
      rows.push([o ? o.mpn : s.orderable_id, slotName(s.orderable_id && o ? o.slot_id : ""), s.distributor, s.distributor_sku,
        s.region, s.observed_on, numOr2(s.stock_observed), numOr2(s.moq), numOr2(s.pack_qty),
        s.lead_time_days_class, CH.ladderToText(s), s.currency, s.datasheet_seen ? "yes" : "",
        o ? o.datasheet_url : "", s.observer, s.source_note, s.sample ? "yes" : ""]);
    });
    download("chandler-evidence.csv", CH.toCSV(rows), "text/csv;charset=utf-8");
  }
  function numOr2(v) { return typeof v === "number" ? String(v) : ""; }

  function numOrUndef(v) { var n = parseInt(v, 10); return isFinite(n) ? n : undefined; }
  /* ---------- PACKS ---------- */
  function renderPacks() {
    var root = $("st-packs"); clear(root);
    root.appendChild(el("div", { class: "panel" }, [
      el("h2", { text: "Packs" }),
      el("p", { text: "A pack is a slice of a library in a JSON file. It is how this instrument does community curation without a server: export what you added, attach it to a pull request, and let the next person diff it against theirs before accepting anything." })
    ]));

    var localCount = countLocal();
    root.appendChild(el("div", { class: "panel" }, [
      el("h3", { text: "Export" }),
      el("div", { class: "rowwrap" }, [
        el("button", { class: "btn primary", type: "button", text: "Export the whole library", onclick: function () { download("chandler-library.json", JSON.stringify(packOf(false), null, 2), "application/json"); } }),
        el("button", { class: "btn", type: "button", text: "Export a proposal pack (" + localCount + " records)", onclick: function () { download("chandler-proposal-pack.json", JSON.stringify(packOf(true), null, 2), "application/json"); } })
      ]),
      el("p", { class: "hint", style: "margin-top:8px", text: "A proposal pack holds only what you added or changed on this machine. It is the file to attach to a pull request. The whole library export is your backup." })
    ]));

    var imp = el("div", { class: "panel" });
    imp.appendChild(el("h3", { text: "Import and merge" }));
    imp.appendChild(el("div", { class: "rowwrap" }, [
      el("button", { class: "btn primary", type: "button", text: "Choose a pack file", onclick: function () { pickFile(".json,application/json", handlePack); } })
    ]));
    imp.appendChild(el("div", { id: "mergearea" }));
    root.appendChild(imp);

    root.appendChild(el("div", { class: "panel" }, [
      el("h3", { text: "Add a slot or an orderable by hand" }),
      el("p", { class: "hint", text: "Small additions are quicker here than in a file. Anything you add is marked as yours and rides out in the proposal pack." }),
      addForms()
    ]));

    var archived = state.lib.slots.filter(function (s) { return s.archived; }).length + state.lib.orderables.filter(function (o) { return o.archived; }).length;
    if (archived) {
      root.appendChild(el("div", { class: "panel" }, [
        el("h3", { text: "Archive" }),
        el("p", { class: "hint", text: archived + " archived record" + (archived === 1 ? "" : "s") + ". Nothing is ever deleted outright." }),
        el("button", { class: "btn small", type: "button", text: "Restore everything archived", onclick: function () {
          state.lib.slots.forEach(function (s) { delete s.archived; });
          state.lib.orderables.forEach(function (o) { delete o.archived; });
          save(); render();
        } })
      ]));
    }
    if (lastDiff) renderMerge();
  }
  function countLocal() {
    var n = 0;
    ["slots", "orderables", "sourcing", "decisions", "candidates"].forEach(function (k) {
      (state.lib[k] || []).forEach(function (r) { if (r._origin === "local") n++; });
    });
    return n;
  }
  function packOf(onlyLocal) {
    var out = {
      schema: "chandler.library/1",
      exported_from: "CHANDLER " + VERSION,
      exported_on: today(),
      kind: onlyLocal ? "proposal-pack" : "library",
      slots: [], orderables: [], sourcing: [], decisions: [], candidates: []
    };
    ["slots", "orderables", "sourcing", "decisions", "candidates"].forEach(function (k) {
      (state.lib[k] || []).forEach(function (r) {
        if (!onlyLocal || r._origin === "local") out[k].push(r);
      });
    });
    return out;
  }
  function handlePack(text, name) {
    var pack;
    try { pack = JSON.parse(text); }
    catch (e) { alert("That file is not valid JSON, so there is nothing to merge."); return; }
    var probe = { slots: pack.slots || [], orderables: pack.orderables || [], sourcing: pack.sourcing || [], decisions: [] };
    var errs = CH.validateLibrary({ slots: probe.slots, orderables: probe.orderables, sourcing: probe.sourcing });
    lastDiff = CH.diffPack(state.lib, pack);
    lastDiff._name = name;
    lastDiff._errors = errs;
    acceptedMerge = {};
    lastDiff.adds.concat(lastDiff.changes).forEach(function (d) { acceptedMerge[d.kind + ":" + d.key] = true; });
    renderMerge();
  }
  function renderMerge() {
    var area = $("mergearea"); if (!area) return; clear(area);
    if (!lastDiff) return;
    var d = lastDiff;
    area.appendChild(el("h3", { text: "Merging " + (d._name || "pack") }));
    if (d.invalid.length) {
      area.appendChild(el("div", { class: "notice bad", text: d.invalid.join(" ") }));
      return;
    }
    if (d._errors && d._errors.length) {
      area.appendChild(el("div", { class: "notice warn" }, [
        el("strong", { text: "This pack has " + d._errors.length + " validation problem" + (d._errors.length === 1 ? "" : "s") + ". " }),
        el("span", { text: "You can still merge it, but the problems will be in your library too: " + d._errors.slice(0, 4).join(" ") })
      ]));
    }
    area.appendChild(el("p", { class: "hint", text: d.adds.length + " new, " + d.changes.length + " changed, " + d.unchanged.length + " already identical. Untick anything you do not want." }));
    var rows = d.adds.map(function (x) { return { d: x, kind: "new" }; })
      .concat(d.changes.map(function (x) { return { d: x, kind: "changed" }; }));
    if (!rows.length) {
      area.appendChild(el("div", { class: "empty", text: "Nothing in this pack differs from what you already have." }));
      return;
    }
    var t = el("table");
    var head = el("tr");
    ["Take", "What", "Record", "Detail"].forEach(function (h) { head.appendChild(el("th", { text: h })); });
    t.appendChild(el("thead", null, [head]));
    var body = el("tbody");
    rows.slice(0, 400).forEach(function (r) {
      var key = r.d.kind + ":" + r.d.key;
      var cb = el("input", { type: "checkbox" });
      cb.checked = !!acceptedMerge[key];
      cb.addEventListener("change", function () { acceptedMerge[key] = cb.checked; });
      var tr = el("tr");
      tr.appendChild(el("td", null, [cb]));
      tr.appendChild(el("td", null, [el("span", { class: "stamp " + (r.kind === "new" ? "pass" : "unknown"), text: r.kind })]));
      tr.appendChild(el("td", { class: "mono", text: r.d.kind + " " + r.d.key }));

  /* ---------- BOM coverage ---------- */
  function importBomForCoverage() {
    pickFile(".csv,text/csv", function (text, name) {
      var rows = CH.parseCSV(text);
      if (!rows.length) { alert("That file has no rows in it."); return; }
      var head = rows[0].map(function (h) { return String(h).trim().toLowerCase(); });
      var mpnCol = head.indexOf("mpn");
      if (mpnCol === -1) mpnCol = head.indexOf("part number");
      if (mpnCol === -1) mpnCol = head.indexOf("manufacturer part number");
      if (mpnCol === -1) { alert("No column called mpn, part number, or manufacturer part number. CHANDLER needs one of those to match on."); return; }
      var refCol = head.indexOf("ref"), qtyCol = head.indexOf("qty");
      var data = rows.slice(1).map(function (r) {
        return { ref: refCol >= 0 ? r[refCol] : "", mpn: r[mpnCol], qty: qtyCol >= 0 ? r[qtyCol] : "" };
      }).filter(function (r) { return String(r.mpn || "").trim(); });
      var cov = CH.coverageCheck(data, state.lib);
      cov.rows = data;
      showCoverage(cov, String(name || "").replace(/\.csv$/i, ""));
    });
  }

  /* A gap becomes a provisional slot with the part already attached, so the

  function slotFromGap(mpn) {
    var id = "U-" + Date.now().toString(36).toUpperCase();
    state.lib.slots.push({
      id: id, domain: "electronic",
      category_path: ["Uncatalogued"],

      key_parameters: [],
      preferred_family: "",
      why_this_family: "",
      typical_applications: [],
      coverage_note: "",
      numbering_scheme: "",
      status: "provisional",
      from_gap: mpn,
      _origin: "local"
    });
    state.lib.orderables.push({
      id: "U-" + Date.now().toString(36).toUpperCase() + "O", slot_id: id,
      mpn: mpn, manufacturer: "", description: "", package_or_size: "", finish_or_material: "",
      drop_in: "yes", drop_in_deviation: "", hand_workable: true, hand_workable_note: "",

  function rejectCandidate(mpn) {
    var reason = window.prompt("Why does " + mpn + " not belong in the library? This is the only thing that makes recording it worthwhile.", "");
    if (reason === null) return;
    if (!String(reason).trim()) { alert("A rejection with no reason is worse than no record, because the next person has to work it out again."); return; }
    (state.lib.candidates || (state.lib.candidates = [])).push({
      id: "C-" + Date.now().toString(36).toUpperCase(),
      mpn: mpn, manufacturer: "", slot_id: "",
      reason: String(reason).trim(), considered_on: today(),
      observer: state.observer || "", _origin: "local"
    });
    save(); render();
    setSaveState(mpn + " recorded as considered and rejected");
  }

  function loadSample() {
    if (state.sampleLoaded) return;

    (sampleEvidence.sourcing || []).forEach(function (s) {
      if (!CH.findOrderable(state.lib, s.orderable_id)) return;
      var copy = CH.clone(s); copy.sample = true;
      state.lib.sourcing.push(copy); added++;

    state.sampleLoaded = true; save(); render();
    setSaveState(added + " sample observations loaded. They are marked and do not count unless you switch them on.");
  }

  function runSelfTest() {

      return;
    }
    out.appendChild(el("div", { class: r.failed ? "notice bad" : "notice", text: r.passed + " of " + r.total + " assertions passed. " + (r.failed ? r.failed + " failed." : "Nothing failed.") }));
    var box = el("div", { style: "max-height:280px; overflow:auto; margin-top:8px" });
    r.results.forEach(function (x) {
      box.appendChild(el("div", { class: "testline" + (x.pass ? "" : " bad"), text: (x.pass ? "pass  " : "FAIL  ") + x.name + (x.detail ? "   " + x.detail : "") }));
    });
    out.appendChild(box);
  }

  /* ---------- render ---------- */
  function render() {
    switch (state.ui.station) {
      case "library": renderLibrary(); break;
      case "slot": renderSlot(); break;
      case "admission": renderAdmission(); break;
      case "basket": renderBasket(); break;
      case "stock": renderStock(); break;
      case "packs": renderPacks(); break;
      case "evidence": renderEvidence(); break;
      case "about": renderAbout(); break;
    }
  }

  /* ---------- keyboard ---------- */
  function isTyping(t) {
    if (!t) return false;
    var tag = (t.tagName || "").toLowerCase();
    return tag === "input" || tag === "textarea" || tag === "select" || t.isContentEditable;
  }
  function installKeys() {
    document.addEventListener("keydown", function (e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === "/" && !isTyping(e.target)) {
        e.preventDefault();
        if (state.ui.station !== "library") go("library");
        var q = $("q");
        if (q) { q.focus(); q.select(); }
        return;
      }
      if (e.key === "Escape" && e.target && e.target.id === "q") {
        e.target.value = "";
        state.ui.filters.q = "";
        renderSlotList();
        e.target.blur();
      }
    });
  }

  /* ---------- boot ---------- */
  function boot() {
    try { localStorage.setItem("chandler.probe", "1"); localStorage.removeItem("chandler.probe"); }
    catch (e) { storageOK = false; }
    state = load() || freshState();
    $("verstamp").textContent = VERSION;
    applyTheme();
    STATIONS.forEach(function (s) { $("st-" + s.id).hidden = s.id !== state.ui.station; });
    renderNav();
    render();
    installKeys();
    if (!storageOK) setSaveState("Held in memory only. Export before you close the tab.");
    else setSaveState(state.savedAt ? "Restored from this machine" : "Ready");
    debug("booted", VERSION, state.lib.slots.length + " slots");
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</body>
</html>
